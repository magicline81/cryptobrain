      radial-gradient(circle at top left, rgba(23,86,200,.10), transparent 28%),

  ::-webkit-scrollbar { width:6px; }
  ::-webkit-scrollbar-track { background:#f0f2f7; }
  ::-webkit-scrollbar-thumb { background:#c8cfe8; border-radius:3px; }
  .page-shell { position:relative; overflow:hidden; }
  .page-shell::before {
    content:"";
    position:absolute;
    inset:0;
    background:
      linear-gradient(120deg, rgba(255,255,255,.46), transparent 36%),
      linear-gradient(180deg, rgba(255,255,255,.12), transparent 55%);
    pointer-events:none;
  }
  .page-inner { position:relative; z-index:1; }
  .hero-panel {
    position:relative;
    overflow:hidden;
    border:1px solid rgba(204,212,228,.9);
    border-radius:28px;
    background:linear-gradient(145deg, rgba(255,255,255,.92), rgba(244,247,253,.95));
    box-shadow:var(--shadow-soft);
    backdrop-filter:blur(14px);
  }
  .hero-panel::after {
    content:"";
    position:absolute;
    width:280px;
    height:280px;
    right:-110px;
    top:-140px;
    background:radial-gradient(circle, rgba(23,86,200,.14), transparent 66%);
    pointer-events:none;
  }
  .frost-card {
    background:var(--bg-panel);
    border:1px solid var(--border-soft);
    box-shadow:var(--shadow-soft);
    backdrop-filter:blur(14px);
  }
  .coin-card {
    position:relative;
    transition:transform .28s ease, box-shadow .28s ease, border-color .28s ease, background .28s ease;
    will-change:transform;
  }
  .coin-card:hover {
    transform:translateY(-6px);
    box-shadow:var(--shadow-hover);
  }
  .soft-hover {
    transition:transform .24s ease, box-shadow .24s ease, border-color .24s ease, background .24s ease;
  }
  .soft-hover:hover {
    transform:translateY(-3px);
    box-shadow:0 18px 38px rgba(33,44,82,.10);
  }
  .tab-chip {
    transition:transform .22s ease, box-shadow .22s ease, background .22s ease, border-color .22s ease;
  }
  .tab-chip:hover {
    transform:translateY(-2px);
    box-shadow:0 14px 26px rgba(23,86,200,.12);
  }
  .fade-up {
    opacity:0;
    transform:translateY(18px);
    animation:fadeUp .58s cubic-bezier(.2,.7,.2,1) forwards;
  }
  .gauge-shell {
    position:relative;
    border-radius:24px;
    background:linear-gradient(180deg, rgba(255,255,255,.58), rgba(255,255,255,.14));
    border:1px solid rgba(210,217,232,.72);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.7);
    overflow:hidden;
  }
  .gauge-shell::before {
    content:"";
    position:absolute;
    inset:10px 14px auto 14px;
    height:55%;
    border-radius:18px 18px 26px 26px;
    background:linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,0));
    pointer-events:none;
  }
  .gauge-svg {
    overflow:visible;
    filter:drop-shadow(0 16px 24px rgba(33,44,82,.08));
  }
  .gauge-track-soft {
    opacity:.9;
  }
  .gauge-value-arc {
    stroke-dasharray:280;
    stroke-dashoffset:280;
    animation:gaugeSweep 1.2s cubic-bezier(.2,.7,.2,1) forwards;
  }
  .gauge-needle {
    transform-origin:100px 100px;
    animation:needleRise 1s cubic-bezier(.22,.8,.22,1) forwards;
  }
  .gauge-score {
    opacity:0;
    transform:translateY(8px);
    animation:gaugeScoreIn .55s ease forwards;
    animation-delay:.35s;
  }
  .gauge-pulse {
    animation:gaugePulse 3.6s ease-in-out infinite;
  }
  @keyframes fadeUp {
    to {
      opacity:1;
      transform:translateY(0);
    }
  }
  @keyframes gaugeSweep {
    to { stroke-dashoffset:var(--dash-end, 0); }
  }
  @keyframes needleRise {
    from { transform:rotate(-92deg); opacity:0; }
    to { transform:rotate(var(--needle-rotation, 0deg)); opacity:1; }
  }
  @keyframes gaugeScoreIn {
    to { opacity:1; transform:translateY(0); }
  }
  @keyframes gaugePulse {
    0%,100% { transform:scale(1); opacity:.9; }
    50% { transform:scale(1.03); opacity:1; }
  }

  /* Loading */
  #loading {
    position:fixed; inset:0;
    background:#f0f2f7;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:14px; z-index:9999;
    font-family: system-ui, sans-serif;
  }
  .spinner {
    width:40px; height:40px;
    border:4px solid #e2e6f0;
    border-top-color:#1756c8;
    border-radius:50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  .loading-text { font-size:13px; color:#9aa0bc; letter-spacing:2px; text-transform:uppercase; }

  /* Grid responsive */
  @media(max-width:900px) {
    .main-grid { grid-template-columns: 1fr !important; }
    .signal-panel { position: static !important; }

  }
  @media(max-width:600px) {
    .coin-grid { grid-template-columns: 1fr !important; }
    .hero-panel { border-radius:22px; }
  }
</style>
</head>

function clampScore(value) {
  return Math.max(0, Math.min(100, Math.round(value)));
}

function parsePriceValue(value) {
  return parseFloat(String(value).replace(/,/g, "").replace(/[^0-9.]/g, "")) || 0;
}

function getWeightedScore(items) {
  const totalWeight = items.reduce((sum, item) => sum + item.weight, 0) || 1;
  const weightedValue = items.reduce((sum, item) => sum + item.score * item.weight, 0) / totalWeight;
  return clampScore(weightedValue);
}

function getMarketVerdict(score) {
  if (score >= 70) return "AKKUMULIEREN";
  if (score >= 55) return "VORSICHTIG KAUFEN";
  if (score >= 40) return "ABWARTEN";
  if (score >= 25) return "DEFENSIV";
  return "MEIDEN";
}

function buildMarketBreakdownBars(baseBars, components) {
  const componentMap = Object.fromEntries(components.map(component => [component.name, component]));
  return baseBars.map(bar => {
    const groupMembers = MARKET_BREAKDOWN_GROUPS[bar.name] || [];
    const groupComponents = groupMembers
      .map(member => componentMap[member])
      .filter(Boolean);
    if (!groupComponents.length) return bar;
    return {
      ...bar,
      score: getWeightedScore(groupComponents),
    };
  });
}

function getMarketComponentScores(breakdownBars) {
  const scoreMap = Object.fromEntries(breakdownBars.map(item => [item.name, item.score]));
  return {
    "Fear & Greed Index": scoreMap["Sentiment F&G"] || 50,
    "BTC Dominanz": scoreMap["BTC Dominanz"] || 50,
    "On-Chain": scoreMap["On-Chain"] || 50,
    "Katalysatoren": scoreMap["Katalysatoren"] || 50,
    "Fed & Zinspolitik": scoreMap["Fed & Zinsen"] || 50,
    "Geopolitik / Kriege": scoreMap["Geopolitik"] || 50,
    "Institutionelle Flows": scoreMap["Inst. Flows"] || 50,
  };
}

function getChanceRiskProfile(components, marketScore) {
  const componentMap = Object.fromEntries(components.map(component => [component.name, component.score]));
  const upsideComposite = getWeightedScore([
    { score: componentMap["Fear & Greed Index"] || 50, weight:25 },
    { score: componentMap["Upgrade-Katalysatoren"] || 50, weight:25 },
    { score: componentMap["Institutionelle ETF Flows"] || 50, weight:25 },
    { score: componentMap["On-Chain Adressen"] || 50, weight:15 },
    { score: componentMap["Regulierung / ETFs"] || 50, weight:10 },
  ]);
  const downsidePressure = getWeightedScore([
    { score: 100 - (componentMap["BTC Dominanz"] || 50), weight:30 },
    { score: 100 - (componentMap["Fed & Zinspolitik"] || 50), weight:25 },
    { score: 100 - (componentMap["Geopolitik / Kriege"] || 50), weight:25 },
    { score: 100 - (componentMap["Exchange Flows"] || 50), weight:20 },
  ]);
  const contrarianBoost = Math.max(0, 55 - marketScore) / 100;
  const upside = Math.max(0.8, Math.min(3.5, 0.9 + (upsideComposite / 100) * 1.6 + contrarianBoost));
  const risk = Math.max(0.8, Math.min(2.5, 0.8 + (downsidePressure / 100) * 1.2));
  const ratio = upside / risk;
  return {
    upside: Math.round(upside * 10) / 10,
    risk: Math.round(risk * 10) / 10,
    ratio: Math.round(ratio * 100) / 100,
    upsideComposite,
    downsidePressure,
  };
}

function getWeightedMarketScore(components, marketScores) {
  return components.reduce((sum, component) => sum + (marketScores[component.label] || 50) * component.weight, 0) / 100;
}

function getDynamicSubScore(baseScore, label, marketScores, dynamicDiscountScore) {
  const marketComponents = getCoinSubScoreComponents(label);
  const weightedMarketScore = getWeightedMarketScore(marketComponents, marketScores);
  const sensitivity = {
    "Upgrade-Katalysator":0.30,
    "Institutionelle Flows":0.35,
    "Technologie":0.20,
    "Fundamentals":0.20,
    "Makro-Exposition":0.45,
    "Discount zum ATH":0.30,
  }[label] || 0.20;

  const adjustedBase = label === "Discount zum ATH"
    ? (baseScore * 0.35) + (dynamicDiscountScore * 0.65)
    : baseScore;

  const marketTilt = (weightedMarketScore - 50) / 50;
  const headroom = marketTilt >= 0 ? (100 - adjustedBase) : adjustedBase;
  const regimeAdjustment = headroom * marketTilt * sensitivity;
  const finalScore = clampScore(adjustedBase + regimeAdjustment);

  return {
    score: finalScore,
    components: marketComponents.map(component => ({
      ...component,
      sourceScore: marketScores[component.label] || 50,
    })),
    weightedMarketScore: Math.round(weightedMarketScore),
    adjustedBase: Math.round(adjustedBase * 10) / 10,
    regimeAdjustment: Math.round(regimeAdjustment * 10) / 10,
    marketTilt: Math.round(marketTilt * 100) / 100,
  };
}

  const y=(cy-r*Math.sin(rad)).toFixed(2);
  const z1x=(cx+r*Math.cos(Math.PI*0.75)).toFixed(2), z1y=(cy-r*Math.sin(Math.PI*0.75)).toFixed(2);
  const z2x=(cx+r*Math.cos(Math.PI*0.50)).toFixed(2), z2y=(cy-r*Math.sin(Math.PI*0.50)).toFixed(2);
  const z3x=(cx+r*Math.cos(Math.PI*0.25)).toFixed(2), z3y=(cy-r*Math.sin(Math.PI*0.25)).toFixed(2);
  const arcLength = Math.PI * r;
  const dashEnd = (arcLength * (1 - score / 100)).toFixed(2);
  const needleRotation = `${((score / 100) * 180) - 90}deg`;

  return (
    <div className="gauge-shell" style={{position:"relative",width:236,height:154,margin:"0 auto 10px",paddingTop:12,overflow:"hidden"}}>
      <svg className="gauge-svg" viewBox="0 0 200 124" style={{width:"100%",height:"100%"}}>
        <defs>
          <linearGradient id={`mainArcModern-${score}`} x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stopColor={color} stopOpacity=".45" />
            <stop offset="100%" stopColor={color} stopOpacity="1" />
          </linearGradient>
          <filter id={`mainGlowModern-${score}`} x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="5" result="blur" />
            <feMerge>
              <feMergeNode in="blur" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
        </defs>
        <circle cx="100" cy="100" r="87" fill="rgba(255,255,255,.55)" opacity=".7"/>
        <path d="M 20 100 A 80 80 0 0 1 180 100" fill="none" stroke="rgba(214,220,233,.82)" strokeWidth="16" strokeLinecap="round" className="gauge-track-soft"/>
        <path d={`M 20 100 A 80 80 0 0 1 ${z1x} ${z1y}`} fill="none" stroke="#ffd7db" strokeWidth="16" strokeLinecap="round" opacity=".86"/>
        <path d={`M ${z1x} ${z1y} A 80 80 0 0 1 ${z2x} ${z2y}`} fill="none" stroke="#ffe9bc" strokeWidth="16" strokeLinecap="round" opacity=".92"/>
        <path d={`M ${z2x} ${z2y} A 80 80 0 0 1 ${z3x} ${z3y}`} fill="none" stroke="#d8f3e3" strokeWidth="16" strokeLinecap="round" opacity=".92"/>
        <path d={`M ${z3x} ${z3y} A 80 80 0 0 1 180 100`} fill="none" stroke="#a9e2bc" strokeWidth="16" strokeLinecap="round" opacity=".95"/>
        <path d={`M 20 100 A 80 80 0 0 1 ${x} ${y}`} fill="none" stroke={`url(#mainArcModern-${score})`} strokeWidth="16" strokeLinecap="round" filter={`url(#mainGlowModern-${score})`} className="gauge-value-arc" style={{ "--dash-end": dashEnd }} />
        <g className="gauge-needle" style={{ "--needle-rotation": needleRotation }}>
          <line x1="100" y1="100" x2="100" y2="28" stroke="#1a1e2e" strokeWidth="3.2" strokeLinecap="round"/>
          <circle cx="100" cy="100" r="9" fill="#fff" stroke={color} strokeWidth="4"/>
          <circle cx="100" cy="100" r="4.4" fill="#1a1e2e"/>
        </g>
        <circle cx="100" cy="100" r="58" fill="rgba(255,255,255,.74)" stroke="rgba(223,228,239,.9)" strokeWidth="1.5"/>
      </svg>
      <div style={{position:"absolute",bottom:34,left:"50%",transform:"translateX(-50%)",textAlign:"center"}}>
        <div className="gauge-score" style={{fontFamily:"Georgia,serif",fontSize:42,fontWeight:900,color,lineHeight:1}}>{score}</div>
        <div className="gauge-score" style={{fontFamily:"'DM Mono',monospace",fontSize:10,letterSpacing:2,textTransform:"uppercase",color:"#9aa0bc",marginTop:5,animationDelay:".45s"}}>Market Score</div>
      </div>
    </div>
  );
}

                    <div style={{ display:"flex", justifyContent:"space-between", gap:12, alignItems:"baseline", marginBottom:3 }}>
                      <div style={{ fontSize:11, fontWeight:700, color:"#1a1e2e" }}>{label}</div>
                      <div style={{ ...mono, fontSize:9, color:"#1756c8", flexShrink:0 }}>{source.source}</div>
                    </div>
                    <div style={{ fontSize:10, color:"#5a6282", lineHeight:1.6 }}>{source.detail}</div>
                    <div style={{ fontSize:10, color:"#9aa0bc", lineHeight:1.6 }}>Verwendet fuer: {source.usedFor}</div>
                  </div>
                ))}
              </div>

              {/* Alerts */}
              <div className="frost-card soft-hover fade-up" style={{ ...card, animationDelay:".22s" }}>
                <div style={{ ...mono, fontSize:10, letterSpacing:3, textTransform:"uppercase", color:"#9aa0bc", marginBottom:10 }}>⚡ Key Alerts</div>
                {META.alerts.map((a,i)=>{
                  const [bg,border]=aBg(a.type);
                  return (
                    <div key={i} style={{ background:bg, border:`1px solid ${border}`, borderRadius:8, padding:"9px 11px", marginBottom:8, display:"flex", gap:8 }}>
                      <div style={{ fontSize:14, flexShrink:0 }}>{a.icon}</div>
                      <div style={{ fontSize:11, color:"#5a6282", lineHeight:1.6 }}>{a.msg}</div>
                    </div>
                  );
                })}
              </div>
            </div>

            {/* RIGHT */}
            <div className="signal-panel" style={{ position:"sticky", top:14, alignSelf:"stretch", display:"flex", flexDirection:"column", gap:18, minHeight:"100%" }}>
              <div className="frost-card soft-hover fade-up" style={{ ...card, textAlign:"center", animationDelay:".16s" }}>
                <div style={{ ...mono, fontSize:10, letterSpacing:3, textTransform:"uppercase", color:"#9aa0bc", marginBottom:10 }}>🎯 Markt Signal Score</div>
                <Gauge score={MARKET_TOTAL_SCORE} color={col}/>
                <div style={{ ...mono, fontSize:9, letterSpacing:2, color:"#9aa0bc", textTransform:"uppercase", marginBottom:8 }}>Gesamtsignal (0–100)</div>
                <div style={{ fontFamily:"Georgia,serif", fontSize:19, fontWeight:700, marginBottom:5, color:col }}>
                  {vEmoji[MARKET_VERDICT]} {MARKET_VERDICT}
                </div>
                <div style={{ fontSize:12, color:"#5a6282", lineHeight:1.6, marginBottom:12 }}>
                  Der Wert entsteht als gewichteter 12-Komponenten-Score. Hohe Makro-Belastung drueckt ihn, starke Sentiment- und Flow-Daten st?tzen ihn.
                </div>
                <div style={{ fontSize:11, color:"#9aa0bc", lineHeight:1.6, marginBottom:12 }}>
                  Markt-Signal = gewichtetes 12-Indikatoren-Modell. Coin-Scores = Coin-Basiswert plus marktseitiger Regime-Effekt.
                </div>
                {/* CHANCE / RISIKO with explanation */}
                <div style={{ marginBottom:12 }}>
                  <div style={{ display:"flex", gap:8, marginBottom:8 }}>
                    <div style={{ flex:1, background:"#e6f7f0", border:"1.5px solid #80d4b0", borderRadius:8, padding:"10px 12px", textAlign:"center" }}>
                      <div style={{ ...mono, fontSize:9, letterSpacing:2, textTransform:"uppercase", color:"#00875a", marginBottom:2 }}>📈 Chance</div>
                      <div style={{ fontFamily:"Georgia,serif", fontSize:26, fontWeight:900, color:"#00875a", lineHeight:1 }}>{CHANCE_RISK_PROFILE.upside.toFixed(1)}x</div>
                      <div style={{ fontSize:10, color:"#00875a", marginTop:2, opacity:.8 }}>potenzieller Gewinn</div>
                    </div>
                    <div style={{ flex:1, background:"#ffeef0", border:"1.5px solid #f0b0b8", borderRadius:8, padding:"10px 12px", textAlign:"center" }}>
                      <div style={{ ...mono, fontSize:9, letterSpacing:2, textTransform:"uppercase", color:"#c0182a", marginBottom:2 }}>📉 Risiko</div>
                      <div style={{ fontFamily:"Georgia,serif", fontSize:26, fontWeight:900, color:"#c0182a", lineHeight:1 }}>{CHANCE_RISK_PROFILE.risk.toFixed(1)}x</div>
                      <div style={{ fontSize:10, color:"#c0182a", marginTop:2, opacity:.8 }}>möglicher Verlust</div>
                    </div>
                  </div>
                  {/* Explanation box */}
                  <div style={{ background:"#f7f8fc", border:"1px solid #e2e6f0", borderRadius:8, padding:"11px 13px" }}>
                    <div style={{ ...mono, fontSize:9, letterSpacing:2, textTransform:"uppercase", color:"#9aa0bc", marginBottom:6 }}>💡 Was bedeutet das?</div>
                    <div style={{ fontSize:12, color:"#5a6282", lineHeight:1.7, marginBottom:8 }}>{META.chanceRisikoInfo.erklärung}</div>
                    <div style={{ background:"#fff", border:"1px solid #e2e6f0", borderRadius:6, padding:"8px 10px", marginBottom:8 }}>
                      <div style={{ ...mono, fontSize:9, color:"#b06a00", letterSpacing:1, marginBottom:3 }}>📌 KONKRETES BEISPIEL</div>
                      <div style={{ fontSize:12, color:"#1a1e2e", lineHeight:1.7 }}>Bei {CHANCE_RISK_PROFILE.upside.toFixed(1)}x Chance zu {CHANCE_RISK_PROFILE.risk.toFixed(1)}x Risiko ergibt sich rechnerisch ein Verhaeltnis von {CHANCE_RISK_PROFILE.ratio.toFixed(2)}:1.</div>
                    </div>
                    <div
                      onClick={() => setOpenChanceRiskDetails(prev => !prev)}
                      style={{ background:openChanceRiskDetails ? "#eef3ff" : "#fff", border:"1px solid #d8def0", borderRadius:6, padding:"9px 10px", marginBottom:8, cursor:"pointer" }}
                    >
                      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", gap:10 }}>
                        <div>
                          <div style={{ ...mono, fontSize:9, color:"#1756c8", letterSpacing:1, marginBottom:2 }}>HERLEITUNG DER KENNZAHLEN</div>
                          <div style={{ fontSize:11, color:"#5a6282", lineHeight:1.6 }}>Wie Chance und Risiko im Modell bewertet werden</div>
                        </div>
                        <div style={{ fontSize:11, fontWeight:700, color:"#1756c8", flexShrink:0 }}>{openChanceRiskDetails ? "▲" : "▼"}</div>
                      </div>
                      {openChanceRiskDetails && (
                        <div style={{ marginTop:9, paddingTop:9, borderTop:"1px solid #d8def0" }}>
                          {CHANCE_RISK_DERIVATION.map((item, index) => (
                            <div key={index} style={{ fontSize:12, color:"#1a1e2e", lineHeight:1.7, marginBottom:index === CHANCE_RISK_DERIVATION.length - 1 ? 0 : 6 }}>
                              {item}
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                    <div style={{ fontSize:11, color:"#9aa0bc", lineHeight:1.6 }}>
                      <span style={{ fontWeight:600 }}>Basis:</span> Markt-Score {MARKET_TOTAL_SCORE}/100, bullische Treiber {CHANCE_RISK_PROFILE.upsideComposite}/100, Risikodruck {CHANCE_RISK_PROFILE.downsidePressure}/100.
                    </div>
                    <div style={{ fontSize:11, color:"#9aa0bc", lineHeight:1.6, marginTop:4 }}>
                      <span style={{ fontWeight:600 }}>Einordnung:</span> {META.chanceRisikoInfo.gut}
                    </div>
                  </div>
                </div>

                {/* ANALYST SECTION — structured points */}
                <div style={{ background:"linear-gradient(135deg,#eef3ff,#f7f0ff)", border:"1.5px solid #c0b0f0", borderRadius:9, padding:14, textAlign:"left", marginBottom:10 }}>
                  <div style={{ ...mono, fontSize:10, letterSpacing:2, textTransform:"uppercase", color:"#5b4fcf", marginBottom:10, display:"flex", alignItems:"center", gap:6 }}>
                    🤖 Analyst Einschätzung — einfach erklärt
                  </div>
                  {META.analystPunkte.map((p,i)=>(
                    <div key={i} style={{ marginBottom:10, padding:"10px 12px", borderRadius:8,
                      background: p.typ==="bullish" ? "#e8f7f0" : "#fff0f0",
                      border: `1px solid ${p.typ==="bullish" ? "#80d4b0" : "#f0b0b8"}` }}>
                      <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:5 }}>
                        <span style={{ fontSize:16 }}>{p.emoji}</span>
                        <div style={{ fontSize:12, fontWeight:700, color: p.typ==="bullish" ? "#00875a" : "#c0182a" }}>{p.titel}</div>
                        <span style={{ ...mono, fontSize:9, letterSpacing:1, padding:"2px 7px", borderRadius:4,
                          background: p.typ==="bullish" ? "#00875a" : "#c0182a", color:"#fff", flexShrink:0, marginLeft:"auto" }}>
                          {p.typ==="bullish" ? "✓ BULLISH" : "✗ BEARISH"}
                        </span>
                      </div>
                      <div style={{ fontSize:11, color:"#5a6282", lineHeight:1.7 }}>{p.text}</div>
                    </div>
                  ))}
                  <div style={{ ...mono, fontSize:10, color:"#5b4fcf", marginTop:6, padding:"8px 10px", background:"rgba(91,79,207,.06)", borderRadius:6, lineHeight:1.6 }}>
                    ⚖️ <strong>Fazit:</strong> Das Marktmodell sieht aktuell starke St?tzen bei Sentiment und institutionellen Flows, aber mehrere harte Gegenwinde aus Makro und Dominanz. Deshalb bleibt der Markt-Score im Bereich ABWARTEN statt in eine klare Kaufzone zu kippen.
                  </div>
                </div>
                <div style={{ background:"#fff8e6", border:"1px solid #e8d080", borderRadius:6, padding:"8px 12px", fontSize:10, color:"#7a6020", ...mono, textAlign:"center" }}>
                  ⚠ Keine Finanzberatung — DYOR
                </div>
              </div>

              {/* Breakdown bars */}
              <div className="frost-card soft-hover fade-up" style={{ ...card, animationDelay:".26s", flex:1, display:"flex", flexDirection:"column" }}>
                <div style={{ ...mono, fontSize:10, letterSpacing:3, textTransform:"uppercase", color:"#9aa0bc", marginBottom:6 }}>📊 Score Breakdown</div>
                <div style={{ fontSize:11, color:"#9aa0bc", marginBottom:12 }}>👉 Klicke auf einen Balken für die Erklärung</div>
                {MARKET_BREAKDOWN_BARS.map((b,i)=>{
                  const open = openBreakdown === i;
                  const scoreCol = b.score>=65?"#00875a":b.score>=40?"#b06a00":"#c0182a";
                  return (
                    <div key={i} style={{ borderRadius:8, marginBottom:8, overflow:"hidden", border:`1.5px solid ${open?b.color+"55":"#f0f2f7"}`, transition:"border-color .2s" }}>
                      <div onClick={()=>setOpenBreakdown(open?null:i)} style={{ display:"flex", alignItems:"center", gap:10, padding:"10px 12px", cursor:"pointer", background:open?`${b.color}08`:"#fafbfd" }}>
                        <div style={{ flex:1 }}>
                          <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:6 }}>
                            <div style={{ fontSize:12, fontWeight:600, color:"#1a1e2e", width:100, flexShrink:0 }}>{b.name}</div>
                            <div style={{ flex:1, height:7, background:"#e2e6f0", borderRadius:4, overflow:"hidden" }}>
                              <div style={{ height:"100%", borderRadius:4, background:b.color, opacity:.8, width:`${b.score}%`, transition:"width .4s ease" }}/>
                            </div>
                            <div style={{ ...mono, fontSize:13, fontWeight:700, color:scoreCol, width:26, textAlign:"right", flexShrink:0 }}>{b.score}</div>
                          </div>
                          {open && (
                            <div style={{ display:"flex", gap:8, marginTop:2 }}>
                              <div style={{ flex:1, background:"#e6f7f0", borderRadius:5, padding:"4px 8px", fontSize:10, color:"#00875a", lineHeight:1.5 }}>
                                🟢 {b.signalBull}
                              </div>
                              <div style={{ flex:1, background:"#ffeef0", borderRadius:5, padding:"4px 8px", fontSize:10, color:"#c0182a", lineHeight:1.5 }}>
                                🔴 {b.signalBear}
                              </div>
                            </div>
                          )}
                        </div>
                        <div style={{ color:b.color, fontSize:11, fontWeight:700, flexShrink:0 }}>{open?"▲":"▼"}</div>
                      </div>
                      {open && (
                        <div style={{ background:"#fff", padding:"12px 14px", borderTop:`1px solid ${b.color}22` }}>
                          <div style={{ ...mono, fontSize:9, letterSpacing:2, textTransform:"uppercase", color:b.color, marginBottom:6 }}>🤔 Warum dieser Score?</div>
                          <div style={{ fontSize:12, color:"#5a6282", lineHeight:1.8 }}>{b.erklärung}</div>
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        )}

      </div>
    </div>
  );
}


// ── RENDER ─────────────────────────────────────────────────────────────────────
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

// Loading screen ausblenden
document.getElementById('loading').style.display = 'none';
</script>

</body>
</html>
