        {tab === "performance" && (
          <div className="fade-up" style={{ animationDelay:".12s" }}>

            {/* Statistik-Kacheln */}
            {(() => {
              const all    = paperTrades.closed || [];
              const open   = paperTrades.open   || [];
              const wins   = all.filter(t => t.outcome === "WIN");
              const losses = all.filter(t => t.outcome === "LOSS");
              const winRate = all.length > 0 ? Math.round(wins.length / all.length * 100) : null;
              const avgPnl  = all.length > 0 ? (all.reduce((s,t) => s + (t.pnl_pct || 0), 0) / all.length).toFixed(1) : null;
              const bestCoin = (() => {
                const byTicker = {};
                for (const t of all) { if (!byTicker[t.coin]) byTicker[t.coin] = []; byTicker[t.coin].push(t.pnl_pct || 0); }
                let best = null, bestAvg = -Infinity;
                for (const [tn, pnls] of Object.entries(byTicker)) { const avg = pnls.reduce((a,b)=>a+b,0)/pnls.length; if (avg > bestAvg) { bestAvg = avg; best = tn; } }
                return best;
              })();

              return (
                <div>
                  <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(180px,1fr))", gap:12, marginBottom:16 }}>
                    {[
                      { label:"Offene Positionen", value: open.length, icon:"📊", color:"#1756c8", bg:"#eef3ff" },
                      { label:"Abgeschlossene Trades", value: all.length, icon:"📁", color:"#5b4fcf", bg:"#f0eeff" },
                      { label:"Trefferquote", value: winRate !== null ? `${winRate}%` : "–", icon:"🎯", color: winRate >= 60 ? "#00875a" : winRate >= 40 ? "#b06a00" : "#c0182a", bg: winRate >= 60 ? "#e6f7f0" : winRate >= 40 ? "#fff8e6" : "#ffeef0" },
                      { label:"Ø P&L pro Trade", value: avgPnl !== null ? `${avgPnl > 0 ? "+" : ""}${avgPnl}%` : "–", icon:"💹", color: parseFloat(avgPnl) >= 0 ? "#00875a" : "#c0182a", bg: parseFloat(avgPnl) >= 0 ? "#e6f7f0" : "#ffeef0" },
                      { label:"Wins / Losses", value: `${wins.length} / ${losses.length}`, icon:"⚖️", color:"#b06a00", bg:"#fff8e6" },
                      { label:"Bester Coin", value: bestCoin || "–", icon:"🏆", color:"#00875a", bg:"#e6f7f0" },
                    ].map((kpi, i) => (
                      <div key={i} className="frost-card soft-hover" style={{ ...card, padding:"14px 16px", background:kpi.bg, border:`1.5px solid ${kpi.color}22`, marginBottom:0, textAlign:"center" }}>
                        <div style={{ fontSize:20, marginBottom:4 }}>{kpi.icon}</div>
                        <div style={{ ...mono, fontSize:9, letterSpacing:2, textTransform:"uppercase", color:kpi.color, marginBottom:4 }}>{kpi.label}</div>
                        <div style={{ fontFamily:"Georgia,serif", fontSize:20, fontWeight:700, color:kpi.color }}>{kpi.value}</div>
                      </div>
                    ))}
                  </div>

                  {/* Offene Positionen */}
                  <div className="frost-card" style={{ ...card, marginBottom:16 }}>
                    <div style={{ ...mono, fontSize:10, letterSpacing:2, textTransform:"uppercase", color:"#1756c8", marginBottom:12 }}>📊 Offene Positionen</div>
                    {open.length === 0
                      ? <div style={{ fontSize:12, color:"#9aa0bc" }}>Keine offenen Positionen</div>
                      : open.map((t, i) => {
                          const coinInfo = COINS.find(c => c.ticker === t.coin);
                          const distToTp  = t.take_profit && t.price_at_open ? ((t.take_profit  - t.price_at_open) / t.price_at_open * 100).toFixed(1) : null;
                          const distToSl  = t.stop_loss  && t.price_at_open ? ((t.price_at_open - t.stop_loss)  / t.price_at_open * 100).toFixed(1) : null;
                          const cColor    = coinInfo?.color || "#1756c8";
                          return (
                            <div key={i} style={{ display:"flex", gap:12, alignItems:"center", padding:"10px 12px", borderRadius:10, border:`1px solid ${cColor}22`, background:"rgba(255,255,255,.6)", marginBottom:8, flexWrap:"wrap" }}>
                              <div style={{ width:36, height:36, borderRadius:"50%", background: coinInfo?.bg || "#eef3ff", color:cColor, display:"flex", alignItems:"center", justifyContent:"center", ...mono, fontSize:9, fontWeight:700, flexShrink:0 }}>{t.coin}</div>
                              <div style={{ flex:1, minWidth:120 }}>
                                <div style={{ fontWeight:700, fontSize:13, color:"#1a1e2e" }}>{t.coin}</div>
                                <div style={{ ...mono, fontSize:10, color:"#9aa0bc" }}>Eröffnet: {t.opened} · Kauf zu ${t.entry}</div>
                                {t.chart_buy_zone && <div style={{ ...mono, fontSize:9, color:"#b06a00" }}>Chart-Zielzone: ${t.chart_buy_zone}</div>}
                              </div>
                              <div style={{ textAlign:"right", flexShrink:0 }}>
                                {distToTp  && <div style={{ fontSize:10, color:"#00875a", fontWeight:700 }}>+{distToTp}% bis TP</div>}
                                {distToSl  && <div style={{ fontSize:10, color:"#c0182a" }}>−{distToSl}% bis SL</div>}
                              </div>
                              <div style={{ textAlign:"right", flexShrink:0 }}>
                                <div style={{ ...mono, fontSize:10, fontWeight:700, color:"#b06a00" }}>SL: ${t.stop_loss}</div>
                                <div style={{ ...mono, fontSize:10, fontWeight:700, color:"#00875a" }}>TP: ${t.take_profit}</div>
                              </div>
                            </div>
                          );
                        })
                    }
                  </div>

                  {/* Geschlossene Trades */}
                  <div className="frost-card" style={{ ...card }}>
                    <div style={{ ...mono, fontSize:10, letterSpacing:2, textTransform:"uppercase", color:"#5b4fcf", marginBottom:12 }}>📁 Trade Historie</div>
                    {all.length === 0
                      ? <div style={{ fontSize:12, color:"#9aa0bc" }}>Noch keine abgeschlossenen Trades — die ersten Signale werden täglich simuliert.</div>
                      : (
                        <div>
                          {/* P&L Verlauf Sparkline */}
                          {all.length >= 2 && (
                            <div style={{ marginBottom:12, background:"#f7f8fc", borderRadius:8, padding:"10px 14px", border:"1px solid #e2e6f0" }}>
                              <div style={{ ...mono, fontSize:8, letterSpacing:2, textTransform:"uppercase", color:"#9aa0bc", marginBottom:6 }}>Kumulierter P&L Verlauf</div>
                              <ScoreSparkline
                                data={all.map((_, i) => { const sum = all.slice(0,i+1).reduce((s,t) => s + (t.pnl_pct||0), 0); return Math.round(sum*10)/10; })}
                                color="#1756c8" width={200} height={40}
                              />
                            </div>
                          )}
                          {[...all].reverse().map((t, i) => {
                            const isWin = t.outcome === "WIN";
                            const isLoss = t.outcome === "LOSS";
                            const pnlCol = isWin ? "#00875a" : "#c0182a";
                            const pnlBg  = isWin ? "#e6f7f0" : "#ffeef0";
                            const coinInfo = COINS.find(c => c.ticker === t.coin);
                            const cColor = coinInfo?.color || "#1756c8";
                            return (
                              <div key={i} style={{ display:"flex", gap:10, alignItems:"center", padding:"8px 10px", borderRadius:8, border:`1px solid ${pnlBg}`, background:"rgba(255,255,255,.5)", marginBottom:6, flexWrap:"wrap" }}>
                                <div style={{ width:32, height:32, borderRadius:"50%", background:coinInfo?.bg||"#eef3ff", color:cColor, display:"flex", alignItems:"center", justifyContent:"center", ...mono, fontSize:8, fontWeight:700, flexShrink:0 }}>{t.coin}</div>
                                <div style={{ flex:1, minWidth:100 }}>
                                  <div style={{ fontWeight:700, fontSize:12, color:"#1a1e2e" }}>{t.coin} · {t.signal}</div>
                                  <div style={{ ...mono, fontSize:9, color:"#9aa0bc" }}>{t.opened} → {t.closed}</div>
                                </div>
                                <div style={{ ...mono, fontSize:9, color:"#9aa0bc", flexShrink:0 }}>
                                  ${t.entry} → ${t.exit}
                                </div>
                                <div style={{ display:"flex", alignItems:"center", gap:8, flexShrink:0 }}>
                                  <span style={{ fontSize:9, fontWeight:700, padding:"2px 7px", borderRadius:4, background:pnlBg, color:pnlCol }}>
                                    {isWin ? "WIN" : "LOSS"}
                                  </span>
                                  <span style={{ ...mono, fontSize:13, fontWeight:900, color:pnlCol }}>
                                    {t.pnl_pct > 0 ? "+" : ""}{t.pnl_pct}%
                                  </span>
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      )
                    }
                  </div>

                </div>
              );
            })()}

          </div>
        )}

      </div>
    </div>
  );
}


// ── RENDER ─────────────────────────────────────────────────────────────────────
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

// Loading screen ausblenden
document.getElementById('loading').style.display = 'none';
</script>
