<style>

    --bg-main:#f0f2f7;

    --shadow-soft:0 20px 45px rgba(33,44,82,.08);
    --shadow-hover:0 26px 60px rgba(33,44,82,.14);
    --text-main:#1a1e2e;
    --text-muted:#5a6282;
    --text-soft:#9aa0bc;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body {
    font-family: Outfit, system-ui, sans-serif;
    background:
      radial-gradient(circle at top left, rgba(23,86,200,.10), transparent 28%),
      radial-gradient(circle at top right, rgba(91,79,207,.10), transparent 26%),
      linear-gradient(180deg, #f6f8fc 0%, #edf1f8 100%);
    color:var(--text-main);
  }

  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=DM+Mono:wght@300;400;500&display=swap');

  /* Scrollbar */
  ::-webkit-scrollbar { width:6px; }
  ::-webkit-scrollbar-track { background:#f0f2f7; }
  ::-webkit-scrollbar-thumb { background:#c8cfe8; border-radius:3px; }
  .page-shell { position:relative; overflow:hidden; }
  .page-shell::before {
    content:"";
    position:absolute;
    inset:0;
    background:
      linear-gradient(120deg, rgba(255,255,255,.46), transparent 36%),
      linear-gradient(180deg, rgba(255,255,255,.12), transparent 55%);
    pointer-events:none;
  }
  .page-inner { position:relative; z-index:1; }
  .hero-panel {
    position:relative;
    overflow:hidden;
    border:1px solid rgba(204,212,228,.9);
    border-radius:28px;
    background:linear-gradient(145deg, rgba(255,255,255,.92), rgba(244,247,253,.95));
    box-shadow:var(--shadow-soft);
    backdrop-filter:blur(14px);
  }
  .hero-panel::after {
    content:"";
    position:absolute;
    width:280px;
    height:280px;
    right:-110px;
    top:-140px;
    background:radial-gradient(circle, rgba(23,86,200,.14), transparent 66%);
    pointer-events:none;
  }
  .frost-card {
    background:var(--bg-panel);
    border:1px solid var(--border-soft);
    box-shadow:var(--shadow-soft);
    backdrop-filter:blur(14px);
  }
  .coin-card {
    position:relative;
    transition:transform .28s ease, box-shadow .28s ease, border-color .28s ease, background .28s ease;
    will-change:transform;
  }
  .coin-card:hover {
    transform:translateY(-6px);
    box-shadow:var(--shadow-hover);
  }
  .soft-hover {
    transition:transform .24s ease, box-shadow .24s ease, border-color .24s ease, background .24s ease;
  }
  .soft-hover:hover {
    transform:translateY(-3px);
    box-shadow:0 18px 38px rgba(33,44,82,.10);
  }
  .tab-chip {
    transition:transform .22s ease, box-shadow .22s ease, background .22s ease, border-color .22s ease;
  }
  .tab-chip:hover {
    transform:translateY(-2px);
    box-shadow:0 14px 26px rgba(23,86,200,.12);
  }
  .fade-up {
    opacity:0;
    transform:translateY(18px);
    animation:fadeUp .58s cubic-bezier(.2,.7,.2,1) forwards;
  }
  .gauge-shell {
    position:relative;
    border-radius:24px;
    background:linear-gradient(180deg, rgba(255,255,255,.58), rgba(255,255,255,.14));
    border:1px solid rgba(210,217,232,.72);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.7);
    overflow:hidden;
  }
  .gauge-shell::before {
    content:"";
    position:absolute;
    inset:10px 14px auto 14px;
    height:55%;
    border-radius:18px 18px 26px 26px;
    background:linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,0));
    pointer-events:none;
  }
  .gauge-svg {
    overflow:visible;
    filter:drop-shadow(0 16px 24px rgba(33,44,82,.08));
  }
  .gauge-track-soft {
    opacity:.9;
  }
  .gauge-value-arc {
    stroke-dasharray:280;
    stroke-dashoffset:280;
    animation:gaugeSweep 1.2s cubic-bezier(.2,.7,.2,1) forwards;
  }
  .gauge-needle {
    transform-origin:100px 100px;
    animation:needleRise 1s cubic-bezier(.22,.8,.22,1) forwards;
  }
  .gauge-score {
    opacity:0;
    transform:translateY(8px);
    animation:gaugeScoreIn .55s ease forwards;
    animation-delay:.35s;
  }
  .gauge-pulse {
    animation:gaugePulse 3.6s ease-in-out infinite;
  }
  @keyframes fadeUp {
    to {
      opacity:1;
      transform:translateY(0);
    }
  }
  @keyframes gaugeSweep {
    to { stroke-dashoffset:var(--dash-end, 0); }
  }
  @keyframes needleRise {
    from { transform:rotate(-92deg); opacity:0; }
    to { transform:rotate(var(--needle-rotation, 0deg)); opacity:1; }
  }
  @keyframes gaugeScoreIn {
    to { opacity:1; transform:translateY(0); }
  }
  @keyframes gaugePulse {
    0%,100% { transform:scale(1); opacity:.9; }
    50% { transform:scale(1.03); opacity:1; }
  }

  /* Loading */
  #loading {
    position:fixed; inset:0;
    background:#f0f2f7;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:14px; z-index:9999;
    font-family: system-ui, sans-serif;
  }
  .spinner {
    width:40px; height:40px;
    border:4px solid #e2e6f0;
    border-top-color:#1756c8;
    border-radius:50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  .loading-text { font-size:13px; color:#9aa0bc; letter-spacing:2px; text-transform:uppercase; }

  /* Grid responsive */
  @media(max-width:900px) {
    .main-grid { grid-template-columns: 1fr !important; }
    .signal-panel { position: static !important; }
    .hero-stack { grid-template-columns:1fr !important; }
  }
  @media(max-width:600px) {
    .coin-grid { grid-template-columns: 1fr !important; }
    .hero-panel { border-radius:22px; }
  }
</style>

function clampScore(value) {
  return Math.max(0, Math.min(100, Math.round(value)));
}

function parsePriceValue(value) {
  return parseFloat(String(value).replace(/,/g, "").replace(/[^0-9.]/g, "")) || 0;
}

function getWeightedScore(items) {
  const totalWeight = items.reduce((sum, item) => sum + item.weight, 0) || 1;
  const weightedValue = items.reduce((sum, item) => sum + item.score * item.weight, 0) / totalWeight;
  return clampScore(weightedValue);
}

function getMarketVerdict(score) {
  if (score >= 70) return "AKKUMULIEREN";
  if (score >= 55) return "VORSICHTIG KAUFEN";
  if (score >= 40) return "ABWARTEN";
  if (score >= 25) return "DEFENSIV";
  return "MEIDEN";
}

function buildMarketBreakdownBars(baseBars, components) {
  const componentMap = Object.fromEntries(components.map(component => [component.name, component]));
  return baseBars.map(bar => {
    const groupMembers = MARKET_BREAKDOWN_GROUPS[bar.name] || [];
    const groupComponents = groupMembers
      .map(member => componentMap[member])
      .filter(Boolean);
    if (!groupComponents.length) return bar;
    return {
      ...bar,
      score: getWeightedScore(groupComponents),
    };
  });
}

function getMarketComponentScores(breakdownBars) {
  const scoreMap = Object.fromEntries(breakdownBars.map(item => [item.name, item.score]));
  return {
    "Fear & Greed Index": scoreMap["Sentiment F&G"] || 50,
    "BTC Dominanz": scoreMap["BTC Dominanz"] || 50,
    "On-Chain": scoreMap["On-Chain"] || 50,
    "Katalysatoren": scoreMap["Katalysatoren"] || 50,
    "Fed & Zinspolitik": scoreMap["Fed & Zinsen"] || 50,
    "Geopolitik / Kriege": scoreMap["Geopolitik"] || 50,
    "Institutionelle Flows": scoreMap["Inst. Flows"] || 50,
  };
}

function getChanceRiskProfile(components, marketScore) {
  const componentMap = Object.fromEntries(components.map(component => [component.name, component.score]));
  const upsideComposite = getWeightedScore([
    { score: componentMap["Fear & Greed Index"] || 50, weight:25 },
    { score: componentMap["Upgrade-Katalysatoren"] || 50, weight:25 },
    { score: componentMap["Institutionelle ETF Flows"] || 50, weight:25 },
    { score: componentMap["On-Chain Adressen"] || 50, weight:15 },
    { score: componentMap["Regulierung / ETFs"] || 50, weight:10 },
  ]);
  const downsidePressure = getWeightedScore([
    { score: 100 - (componentMap["BTC Dominanz"] || 50), weight:30 },
    { score: 100 - (componentMap["Fed & Zinspolitik"] || 50), weight:25 },
    { score: 100 - (componentMap["Geopolitik / Kriege"] || 50), weight:25 },
    { score: 100 - (componentMap["Exchange Flows"] || 50), weight:20 },
  ]);
  const contrarianBoost = Math.max(0, 55 - marketScore) / 100;
  const upside = Math.max(0.8, Math.min(3.5, 0.9 + (upsideComposite / 100) * 1.6 + contrarianBoost));
  const risk = Math.max(0.8, Math.min(2.5, 0.8 + (downsidePressure / 100) * 1.2));
  const ratio = upside / risk;
  return {
    upside: Math.round(upside * 10) / 10,
    risk: Math.round(risk * 10) / 10,
    ratio: Math.round(ratio * 100) / 100,
    upsideComposite,
    downsidePressure,
  };
}

  return Array.from(uniqueMap.values());

function getWeightedMarketScore(components, marketScores) {
  return components.reduce((sum, component) => sum + (marketScores[component.label] || 50) * component.weight, 0) / 100;
}

function getDynamicSubScore(baseScore, label, marketScores, dynamicDiscountScore) {
  const marketComponents = getCoinSubScoreComponents(label);
  const weightedMarketScore = getWeightedMarketScore(marketComponents, marketScores);
  const sensitivity = {
    "Upgrade-Katalysator":0.30,
    "Institutionelle Flows":0.35,
    "Technologie":0.20,
    "Fundamentals":0.20,
    "Makro-Exposition":0.45,
    "Discount zum ATH":0.30,
  }[label] || 0.20;

  const adjustedBase = label === "Discount zum ATH"
    ? (baseScore * 0.35) + (dynamicDiscountScore * 0.65)
    : baseScore;

  const marketTilt = (weightedMarketScore - 50) / 50;
  const headroom = marketTilt >= 0 ? (100 - adjustedBase) : adjustedBase;
  const regimeAdjustment = headroom * marketTilt * sensitivity;
  const finalScore = clampScore(adjustedBase + regimeAdjustment);

  return {
    score: finalScore,
    components: marketComponents.map(component => ({
      ...component,
      sourceScore: marketScores[component.label] || 50,
    })),
    weightedMarketScore: Math.round(weightedMarketScore),
    adjustedBase: Math.round(adjustedBase * 10) / 10,
    regimeAdjustment: Math.round(regimeAdjustment * 10) / 10,
    marketTilt: Math.round(marketTilt * 100) / 100,
  };
}

const CHART_ANALYSES = CHART_ANALYSIS_MODELS.map((analysisItem) => {
  const linkedCoin = COINS.find((coin) => coin.ticker === analysisItem.ticker);
  return {
    ...analysisItem,
    name: linkedCoin?.name || analysisItem.ticker,
    price: linkedCoin?.price || "—",
    change: linkedCoin?.change || "—",
    color: linkedCoin?.color || "#1756c8",
    bg: linkedCoin?.bg || "#eef3ff",
  };
});

function getTradingSignalLabel(score) {
  if (score >= 72) return "AKKUMULIEREN";
  if (score >= 66) return "VORSICHTIG KAUFEN";
  if (score >= 58) return "HALTEN";
  if (score >= 45) return "BEOBACHTEN";
  return "MEIDEN";
}

function getTradingSignalStyle(signal) {
  const styles = {
    "AKKUMULIEREN": { color:"#00875a", bg:"#e6f7f0" },
    "VORSICHTIG KAUFEN": { color:"#4a8a00", bg:"#f0f7e6" },
    "HALTEN": { color:"#b06a00", bg:"#fff8e6" },
    "BEOBACHTEN": { color:"#888", bg:"#f7f8fc" },
    "MEIDEN": { color:"#c0182a", bg:"#ffeef0" },
  };
  return styles[signal] || styles["BEOBACHTEN"];
}

function getToneColors(tone) {
  const styles = {
    bullish: { color:"#00875a", bg:"#e6f7f0", border:"#80d4b0" },
    neutral: { color:"#b06a00", bg:"#fff8e6", border:"#e8d080" },
    bearish: { color:"#c0182a", bg:"#ffeef0", border:"#f0b0b8" },
  };
  return styles[tone] || styles.neutral;
}

function parseLevelValue(level) {
  if (typeof level === "number") return level;
  if (typeof level !== "string") return NaN;
  return Number(level.replace(/,/g, ""));
}

function formatScenarioLevel(level) {
  return typeof level === "number" ? String(level) : level;
}

function buildChartScenario(coin) {
  const support = coin.levels?.support?.[0] || coin.setup?.buyZone;
  const resistance = coin.levels?.resistance?.[0] || coin.setup?.takeProfit?.[0];
  const buyZone = coin.setup?.buyZone || "";
  const stop = coin.setup?.stop || "";

  return {
    bullish: `Bullish bleibt ${coin.ticker}, solange die Buy-Zone ${buyZone} verteidigt wird und der Markt ueber ${formatScenarioLevel(resistance)} ausbricht.`,
    neutral: `Neutral ist das Setup, wenn ${coin.ticker} zwischen ${formatScenarioLevel(support)} und ${formatScenarioLevel(resistance)} seitwaerts rotiert und Trigger-Volumen fehlt.`,
    bearish: `Bearish wird das Bild unter ${stop}. Dann ist die aktuelle Struktur invalidiert und ein tieferer Ruecklauf wahrscheinlich.`,
  };
}

function getSetupMetrics(coin) {
  const buyZone = String(coin.setup?.buyZone || "").split("-").map((value) => parseLevelValue(value.trim())).filter((value) => !Number.isNaN(value));
  const entry = buyZone.length === 2 ? (buyZone[0] + buyZone[1]) / 2 : parseLevelValue(coin.overlay?.current);
  const stop = parseLevelValue(coin.setup?.stop);
  const targets = (coin.setup?.takeProfit || []).map(parseLevelValue).filter((value) => !Number.isNaN(value));
  const firstTarget = targets[0];
  const secondTarget = targets[1];
  const riskPct = entry && stop ? (((entry - stop) / entry) * 100) : 0;
  const rewardPct = entry && firstTarget ? (((firstTarget - entry) / entry) * 100) : 0;
  const stretchPct = entry && secondTarget ? (((secondTarget - entry) / entry) * 100) : 0;

  return {
    entry,
    stop,
    firstTarget,
    secondTarget,
    riskPct,
    rewardPct,
    stretchPct,
  };
}

function formatPercent(value) {
  if (!Number.isFinite(value)) return "n/a";
  const sign = value > 0 ? "+" : "";
  return `${sign}${value.toFixed(1)}%`;
}

function toPatternCandle(candle) {
  return {
    time:candle.time,
    open:Number(candle.open),
    high:Number(candle.high),
    low:Number(candle.low),
    close:Number(candle.close),
  };
}

function getCandleBody(candle) {
  return Math.abs(candle.close - candle.open);
}

function getCandleRange(candle) {
  return Math.max(0.0000001, candle.high - candle.low);
}

function getUpperWick(candle) {
  return candle.high - Math.max(candle.open, candle.close);
}

function getLowerWick(candle) {
  return Math.min(candle.open, candle.close) - candle.low;
}

function isBullishCandle(candle) {
  return candle.close > candle.open;
}

function isBearishCandle(candle) {
  return candle.close < candle.open;
}

function detectCandlestickPatterns(rawCandles) {
  const candles = (rawCandles || []).map(toPatternCandle);
  const found = [];
  const seen = new Set();

  const pushPattern = (key, bias, title, description) => {
    if (seen.has(key)) return;
    seen.add(key);
    const source = candles[Number(String(key).split("-").pop())];
    found.push({ key, bias, title, description, time:source?.time });
  };

  for (let i = Math.max(2, candles.length - 12); i < candles.length; i += 1) {
    const a = candles[i - 2];
    const b = candles[i - 1];
    const c = candles[i];
    if (!a || !b || !c) continue;

    const bodyA = getCandleBody(a);
    const bodyB = getCandleBody(b);
    const bodyC = getCandleBody(c);
    const rangeB = getCandleRange(b);
    const upperC = getUpperWick(c);
    const lowerC = getLowerWick(c);
    const middleB = (b.open + b.close) / 2;
    const midpointA = (a.open + a.close) / 2;

    if ((bodyC / getCandleRange(c)) <= 0.1) {
      pushPattern(`doji-${i}`, "neutral", "Doji", "Unentschlossenheit im Markt. Erst die naechste Kerze entscheidet die Richtung.");
    }

    if (lowerC >= bodyC * 2 && upperC <= Math.max(bodyC * 0.6, getCandleRange(c) * 0.08) && ((c.close - c.low) / getCandleRange(c)) > 0.55) {
      pushPattern(`hammer-${i}`, "bullish", "Hammer", "Langer unterer Schatten signalisiert Absorption und moegliche Bodenreaktion.");
    }

    if (upperC >= bodyC * 2 && lowerC <= Math.max(bodyC * 0.6, getCandleRange(c) * 0.08) && ((c.high - c.close) / getCandleRange(c)) > 0.35) {
      pushPattern(`shooting-${i}`, "bearish", "Shooting Star / Inverted Hammer", "Langer oberer Schatten zeigt Ablehnung hoeherer Preise und moegliche Umkehr.");
    }

    if (isBearishCandle(b) && isBullishCandle(c) && c.open <= b.close && c.close >= b.open && bodyC > bodyB * 0.9) {
      pushPattern(`bull-engulf-${i}`, "bullish", "Bullish Engulfing", "Die letzte Kerze verschlingt die vorangegangene Abwaerts-Kerze und spricht fuer Momentumwechsel.");
    }

    if (isBullishCandle(b) && isBearishCandle(c) && c.open >= b.close && c.close <= b.open && bodyC > bodyB * 0.9) {
      pushPattern(`bear-engulf-${i}`, "bearish", "Bearish Engulfing", "Die letzte Kerze uebernimmt nach oben und kippt dann aggressiv nach unten.");
    }

    if (isBearishCandle(a) && (bodyB / rangeB) < 0.35 && isBullishCandle(c) && c.close > midpointA && middleB < a.close) {
      pushPattern(`morning-${i}`, "bullish", "Morning Star", "Dreikerzen-Umkehrmuster: Verkauf verliert Kontrolle, Nachfrage uebernimmt.");
    }

    if (isBullishCandle(a) && (bodyB / rangeB) < 0.35 && isBearishCandle(c) && c.close < midpointA && middleB > a.close) {
      pushPattern(`evening-${i}`, "bearish", "Evening Star", "Dreikerzen-Umkehrmuster: Aufwaertsdruck ermuedet und wird abverkauft.");
    }

    if (isBearishCandle(b) && isBullishCandle(c) && c.open > b.close && c.open < b.open && c.close < b.open && c.close > midpointA) {
      pushPattern(`piercing-${i}`, "bullish", "Piercing Pattern", "Bullische Rueckeroberung in den Koerper der Vorkerze, oft fruehes Reversal-Signal.");
    }

    if (isBullishCandle(b) && isBearishCandle(c) && c.open < b.close && c.open > b.open && c.close > b.open && c.close < midpointA) {
      pushPattern(`dark-cloud-${i}`, "bearish", "Dark Cloud Cover", "Bearische Umkehr in den Koerper der Vorkerze hinein.");
    }

    if (isBearishCandle(a) && bodyB < bodyA * 0.6 && b.high < a.open && b.low > a.close && isBullishCandle(c)) {
      pushPattern(`bull-harami-${i}`, "bullish", "Bullish Harami", "Die Range zieht sich nach Abwaertsdruck zusammen und bereitet moegliche Richtungswende vor.");
    }

    if (isBullishCandle(a) && bodyB < bodyA * 0.6 && b.high < a.close && b.low > a.open && isBearishCandle(c)) {
      pushPattern(`bear-harami-${i}`, "bearish", "Bearish Harami", "Nach starker Aufwaertskerze zeigt sich Kompression und nachlassendes Momentum.");
    }
  }

  const prioritized = found.slice(-4).reverse();
  const bullishCount = prioritized.filter((item) => item.bias === "bullish").length;
  const bearishCount = prioritized.filter((item) => item.bias === "bearish").length;
  const bias = bullishCount > bearishCount ? "bullish" : bearishCount > bullishCount ? "bearish" : "neutral";

  return {
    patterns: prioritized,
    bias,
    summary: prioritized.length
      ? `Letzte relevante Candlestick-Muster: ${prioritized.map((item) => item.title).join(", ")}.`
      : "In den letzten Kerzen liegt kein starkes Umkehr- oder Fortsetzungsmuster mit hoher Prioritaet vor.",
  };
}

function average(values) {
  if (!values.length) return 0;
  return values.reduce((sum, value) => sum + value, 0) / values.length;
}

function detectStructurePatterns(rawCandles) {
  const candles = (rawCandles || []).map(toPatternCandle);
  if (candles.length < 30) {
    return { status:"insufficient", bias:"neutral", patterns:[], primary:null, summary:"Zu wenige Kerzen fuer belastbare Formationsanalyse." };
  }

  const windowCandles = candles.slice(-36);
  const segment = 6;
  const first = windowCandles.slice(0, segment);
  const last = windowCandles.slice(-segment);
  const firstHalf = windowCandles.slice(0, 18);
  const secondHalf = windowCandles.slice(-18);
  const mid = windowCandles.slice(12, 24);

  const upperStart = average(first.map((c) => c.high));
  const upperEnd = average(last.map((c) => c.high));
  const lowerStart = average(first.map((c) => c.low));
  const lowerEnd = average(last.map((c) => c.low));
  const rangeStart = upperStart - lowerStart;
  const rangeEnd = upperEnd - lowerEnd;
  const avgPrice = average(windowCandles.map((c) => c.close));
  const tolerance = Math.max(avgPrice * 0.012, rangeStart * 0.15);
  const patterns = [];

  const pushPattern = (key, bias, title, description, upperLine, lowerLine) => {
    patterns.push({ key, bias, title, description, upperLine, lowerLine });
  };

  const upperFlat = Math.abs(upperEnd - upperStart) <= tolerance;
  const lowerFlat = Math.abs(lowerEnd - lowerStart) <= tolerance;
  const ascending = lowerEnd > lowerStart + tolerance;
  const descending = upperEnd < upperStart - tolerance;
  const converging = rangeEnd < rangeStart * 0.82;
  const similarSlope = Math.abs((upperEnd - upperStart) - (lowerEnd - lowerStart)) <= Math.max(avgPrice * 0.015, rangeStart * 0.25);

  const upperLine = {
    startTime: first[0].time,
    endTime: last[last.length - 1].time,
    startValue: upperStart,
    endValue: upperEnd,
  };
  const lowerLine = {
    startTime: first[0].time,
    endTime: last[last.length - 1].time,
    startValue: lowerStart,
    endValue: lowerEnd,
  };

  if (upperFlat && ascending && converging) {
    pushPattern("ascending_triangle", "bullish", "Bullisches Dreieck", "Horizontaler Widerstand trifft auf steigende Tiefs. Das spricht fuer Nachfrageaufbau unter dem Trigger-Level.", upperLine, lowerLine);
  }

  if (lowerFlat && descending && converging) {
    pushPattern("descending_triangle", "bearish", "Bearisches Dreieck", "Horizontaler Support wird von fallenden Hochs zusammengedrueckt. Das erhoeht das Risiko eines Breakdown-Setups.", upperLine, lowerLine);
  }

  if (descending && lowerEnd < lowerStart - tolerance && converging) {
    pushPattern("falling_wedge", "bullish", "Falling Wedge", "Beide Trendlinien fallen, aber die Range zieht sich zusammen. Das ist haeufig ein bullisches Exhaustion-Muster.", upperLine, lowerLine);
  }

  if ((upperEnd > upperStart + tolerance) && (lowerEnd > lowerStart + tolerance) && converging) {
    pushPattern("rising_wedge", "bearish", "Rising Wedge", "Steigende Struktur mit enger werdender Range. Momentum baut ab und das macht die Formation anfaellig fuer Ruecksetzer.", upperLine, lowerLine);
  }

  if ((upperEnd > upperStart + tolerance) && (lowerEnd > lowerStart + tolerance) && similarSlope && !converging) {
    pushPattern("ascending_channel", "bullish", "Aufwaertskanal", "Hoehere Hochs und hoehere Tiefs laufen in einem sauberen Kanal. Trendfolge bleibt gueltig, solange die Unterkante haelt.", upperLine, lowerLine);
  }

  if ((upperEnd < upperStart - tolerance) && (lowerEnd < lowerStart - tolerance) && similarSlope && !converging) {
    pushPattern("descending_channel", "bearish", "Abwaertskanal", "Tiefere Hochs und tiefere Tiefs dominieren den Verlauf. Rebounds bleiben vorerst nur Gegenbewegungen.", upperLine, lowerLine);
  }

  const lowA = Math.min(...firstHalf.map((c) => c.low));
  const lowB = Math.min(...secondHalf.map((c) => c.low));
  const midHigh = Math.max(...mid.map((c) => c.high));
  if (Math.abs(lowA - lowB) <= Math.max(avgPrice * 0.015, rangeStart * 0.18) && midHigh > Math.max(lowA, lowB) + Math.max(avgPrice * 0.03, rangeStart * 0.35)) {
    pushPattern("double_bottom", "bullish", "Double Bottom", "Zwei vergleichbare Tiefs mit klarer Zwischenerholung zeigen Absorption im Bodenbereich.", null, null);
  }

  const highA = Math.max(...firstHalf.map((c) => c.high));
  const highB = Math.max(...secondHalf.map((c) => c.high));
  const midLow = Math.min(...mid.map((c) => c.low));
  if (Math.abs(highA - highB) <= Math.max(avgPrice * 0.015, rangeStart * 0.18) && Math.min(highA, highB) > midLow + Math.max(avgPrice * 0.03, rangeStart * 0.35)) {
    pushPattern("double_top", "bearish", "Double Top", "Zwei vergleichbare Hochs mit deutlicher Reaktion dazwischen deuten auf Angebotsdruck im oberen Bereich.", null, null);
  }

  const prioritized = patterns.slice(0, 3);
  const bullishCount = prioritized.filter((item) => item.bias === "bullish").length;
  const bearishCount = prioritized.filter((item) => item.bias === "bearish").length;
  const bias = bullishCount > bearishCount ? "bullish" : bearishCount > bullishCount ? "bearish" : "neutral";
  const primary = prioritized[0] || null;

  return {
    status:"ready",
    bias,
    patterns: prioritized,
    primary,
    summary: primary ? `Primare Formation: ${primary.title}. ${primary.description}` : "Keine dominante Strukturformation mit ausreichender Konvergenz erkannt.",
  };
}

function buildFallbackStructurePattern(coin, candles) {
  if (!coin?.overlay || !candles?.length) return null;
  const start = candles[Math.max(0, candles.length - 28)];
  const end = candles[candles.length - 1];
  if (!start || !end) return null;

  const support = coin.overlay.support || [];
  const resistance = coin.overlay.resistance || [];
  const buyZone = coin.overlay.buyZone || [];
  const formationName = String(coin.overlay.formation || "Struktur");

  const bullish = /bull|aufwaert|steigend|demand|boden|recovery|akkum/i.test(formationName);
  const bearish = /abwaert|bear|druck/i.test(formationName);
  const bias = bullish ? "bullish" : bearish ? "bearish" : "neutral";

  const upperLine = {
    startTime: start.time,
    endTime: end.time,
    startValue: resistance[1] ?? resistance[0] ?? coin.overlay.max,
    endValue: resistance[0] ?? coin.overlay.current,
  };
  const lowerLine = {
    startTime: start.time,
    endTime: end.time,
    startValue: support[1] ?? support[0] ?? coin.overlay.min,
    endValue: buyZone[0] ?? support[0] ?? coin.overlay.current,
  };

  return {
    status:"fallback",
    bias,
    patterns:[{
      key:`fallback-${coin.ticker}`,
      bias,
      title:formationName,
      description:`Fallback-Zeichnung aus dem hinterlegten Chartmodell fuer ${coin.ticker}, damit die Leitstruktur direkt sichtbar bleibt.`,
      upperLine,
      lowerLine,
    }],
    primary:{
      key:`fallback-${coin.ticker}`,
      bias,
      title:formationName,
      description:`Fallback-Zeichnung aus dem hinterlegten Chartmodell fuer ${coin.ticker}, damit die Leitstruktur direkt sichtbar bleibt.`,
      upperLine,
      lowerLine,
    },
    summary:`Fallback-Formation aktiv: ${formationName}. Diese Linie basiert auf dem hinterlegten Coin-Setup und dient als sichtbare Leitstruktur, falls der Live-Scan keine dominante Formation erkennt.`,
  };
}

function MiniGauge({ score, color }) {
  const cx = 100, cy = 100, r = 80;
  const rad = (1 - score / 100) * Math.PI;

  );
}

function ProMarketChart({ coin, interval, title }) {
  const chartRef = useRef(null);
  const [chartStatus, setChartStatus] = useState("loading");
  const precision = getChartPrecision(coin);
  const minMove = Number((1 / (10 ** precision)).toFixed(precision));

  useEffect(() => {
    if (!chartRef.current) return;
    if (!window.LightweightCharts) {
      setChartStatus("library_error");
      return;
    }

    const { createChart, CrosshairMode, LineStyle } = window.LightweightCharts;
    const symbol = coin.symbol.replace("BINANCE:", "");
    const klineInterval = mapChartIntervalToKlineInterval(interval);
    let active = true;
    let resizeObserver = null;
    let chart = null;

    setChartStatus("loading");
    chartRef.current.innerHTML = "";

    fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${klineInterval}&limit=220`)
      .then((response) => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
      })
      .then((rows) => {
        if (!active || !chartRef.current) return;

        try {
          const candles = rows.map((row) => ({
            time: Math.floor(row[0] / 1000),
            open: Number(row[1]),
            high: Number(row[2]),
            low: Number(row[3]),
            close: Number(row[4]),
          })).filter((row) => [row.open, row.high, row.low, row.close].every(Number.isFinite));

          if (!candles.length) throw new Error("No candle data");

          const closes = candles.map((candle) => candle.close);
          const ema20 = [];
          const ema50 = [];
          const ema200 = [];

          for (let i = 0; i < candles.length; i += 1) {
            const slice20 = closes.slice(Math.max(0, i - 59), i + 1);
            const slice50 = closes.slice(Math.max(0, i - 119), i + 1);
            const slice200 = closes.slice(0, i + 1);
            ema20.push({ time:candles[i].time, value:calculateEMA(slice20, 20) ?? candles[i].close });
            ema50.push({ time:candles[i].time, value:calculateEMA(slice50, 50) ?? candles[i].close });
            ema200.push({ time:candles[i].time, value:calculateEMA(slice200, 200) ?? candles[i].close });
          }

          chart = createChart(chartRef.current, {
            width: chartRef.current.clientWidth || 760,
            height: 520,
            layout: {
              background: { color:"#ffffff" },
              textColor: "#5a6282",
              fontFamily: "Outfit, sans-serif",
            },
            grid: {
              vertLines: { color:"#f1f4fa" },
              horzLines: { color:"#eef2f8" },
            },
            rightPriceScale: {
              borderColor:"#e2e6f0",
            },
            timeScale: {
              borderColor:"#e2e6f0",
              timeVisible: interval !== "1D",
              secondsVisible: false,
            },
            crosshair: {
              mode: CrosshairMode.Normal,
              vertLine: { color:"#b9c3d9", width:1, style:LineStyle.Dashed },
              horzLine: { color:"#b9c3d9", width:1, style:LineStyle.Dashed },
            },
          });

        const candleSeries = chart.addCandlestickSeries({
          upColor:"#0d8c61",
          downColor:"#c0182a",
          borderUpColor:"#0d8c61",
          borderDownColor:"#c0182a",
          wickUpColor:"#0d8c61",
          wickDownColor:"#c0182a",
          priceLineVisible:true,
          lastValueVisible:true,
          priceFormat: { type:"price", precision, minMove },
        });
        candleSeries.setData(candles);

        const ema20Series = chart.addLineSeries({ color:"#00875a", lineWidth:2, priceLineVisible:false, lastValueVisible:false, priceFormat: { type:"price", precision, minMove } });
        const ema50Series = chart.addLineSeries({ color:"#1756c8", lineWidth:2, priceLineVisible:false, lastValueVisible:false, priceFormat: { type:"price", precision, minMove } });
        const ema200Series = chart.addLineSeries({ color:"#5b4fcf", lineWidth:2, priceLineVisible:false, lastValueVisible:false, priceFormat: { type:"price", precision, minMove } });
          ema20Series.setData(ema20);
          ema50Series.setData(ema50);
          ema200Series.setData(ema200);

          const priceLines = [
            { value:coin.overlay.stop, color:"#c0182a", title:"Stop", style:LineStyle.Dashed, width:2 },
            ...coin.overlay.support.map((value, index) => ({ value, color:"#00875a", title:`S${index + 1}`, style:index === 0 ? LineStyle.Solid : LineStyle.Dashed, width:index === 0 ? 2 : 1 })),
            ...coin.overlay.resistance.map((value, index) => ({ value, color:"#c0182a", title:`R${index + 1}`, style:index === 0 ? LineStyle.Solid : LineStyle.Dashed, width:index === 0 ? 2 : 1 })),
            ...coin.overlay.targets.map((value, index) => ({ value, color:"#1756c8", title:`TP${index + 1}`, style:LineStyle.Dotted, width:1 })),
          ];
          const candlestickPatterns = detectCandlestickPatterns(candles);
          const detectedStructurePatterns = detectStructurePatterns(candles);
          const structurePatterns = detectedStructurePatterns.primary ? detectedStructurePatterns : (buildFallbackStructurePattern(coin, candles) || detectedStructurePatterns);

          priceLines.forEach((line) => {
            candleSeries.createPriceLine({
              price: line.value,
              color: line.color,
              lineWidth: line.width,
              lineStyle: line.style,
              axisLabelVisible: true,
              title: line.title,
            });
          });

          if (structurePatterns.primary?.upperLine) {
            const upperPatternSeries = chart.addLineSeries({
              color: structurePatterns.primary.bias === "bearish" ? "#b01222" : "#0b57d0",
              lineWidth: 3,
              lineStyle: LineStyle.Solid,
              priceLineVisible: false,
              lastValueVisible: false,
              crosshairMarkerVisible: true,
              priceFormat: { type:"price", precision, minMove },
            });
            upperPatternSeries.setData([
              { time: structurePatterns.primary.upperLine.startTime, value: structurePatterns.primary.upperLine.startValue },
              { time: structurePatterns.primary.upperLine.endTime, value: structurePatterns.primary.upperLine.endValue },
            ]);
          }

          if (structurePatterns.primary?.lowerLine) {
            const lowerPatternSeries = chart.addLineSeries({
              color: structurePatterns.primary.bias === "bearish" ? "#d64550" : "#0b8f5a",
              lineWidth: 3,
              lineStyle: LineStyle.Solid,
              priceLineVisible: false,
              lastValueVisible: false,
              crosshairMarkerVisible: true,
              priceFormat: { type:"price", precision, minMove },
            });
            lowerPatternSeries.setData([
              { time: structurePatterns.primary.lowerLine.startTime, value: structurePatterns.primary.lowerLine.startValue },
              { time: structurePatterns.primary.lowerLine.endTime, value: structurePatterns.primary.lowerLine.endValue },
            ]);
          }

          candleSeries.setMarkers(
            [
              ...(candlestickPatterns.patterns || []).filter((pattern) => pattern.time).map((pattern) => ({
                time: pattern.time,
                position: pattern.bias === "bearish" ? "aboveBar" : "belowBar",
                color: pattern.bias === "bullish" ? "#00875a" : pattern.bias === "bearish" ? "#c0182a" : "#b06a00",
                shape: pattern.bias === "bearish" ? "arrowDown" : pattern.bias === "bullish" ? "arrowUp" : "circle",
                text: pattern.title,
              })),
              ...(structurePatterns.primary && structurePatterns.primary.upperLine ? [{
                time: structurePatterns.primary.upperLine.endTime,
                position: structurePatterns.primary.bias === "bearish" ? "aboveBar" : "belowBar",
                color: structurePatterns.primary.bias === "bullish" ? "#0b57d0" : "#b01222",
                shape: "square",
                text: `FORMATION ${structurePatterns.primary.title.toUpperCase()}`,
              }] : []),
              ...(structurePatterns.primary && structurePatterns.primary.lowerLine ? [{
                time: structurePatterns.primary.lowerLine.endTime,
                position: structurePatterns.primary.bias === "bearish" ? "aboveBar" : "belowBar",
                color: structurePatterns.primary.bias === "bullish" ? "#0b8f5a" : "#d64550",
                shape: "circle",
                text: structurePatterns.primary.bias === "bullish" ? "UNTERKANTE" : "SUPPORT-LINIE",
              }] : []),
            ]
          );

          chart.timeScale().fitContent();

          resizeObserver = new ResizeObserver((entries) => {
            const entry = entries[0];
            if (!entry || !chart) return;
            chart.applyOptions({ width: Math.floor(entry.contentRect.width) });
          });
          resizeObserver.observe(chartRef.current);

          setChartStatus("ready");
        } catch (error) {
          setChartStatus("library_error");
        }
      })
      .catch(() => {
        if (!active) return;
        setChartStatus("data_error");
      });

    return () => {
      active = false;
      if (resizeObserver) resizeObserver.disconnect();
      if (chart) chart.remove();
    };
  }, [coin, interval]);

  return (
    <div>
      <div style={{ height:520, borderRadius:18, overflow:"hidden", border:"1px solid #d8def0", background:"#fff", position:"relative" }}>
        <div ref={chartRef} style={{ height:"100%", width:"100%" }} />
        {chartStatus !== "ready" && (
          <div style={{ position:"absolute", inset:0, display:"flex", alignItems:"center", justifyContent:"center", padding:"24px", background:"linear-gradient(180deg,rgba(255,255,255,.92),rgba(248,250,255,.96))" }}>
            <div style={{ maxWidth:420, textAlign:"center" }}>
              <div style={{ fontFamily:"'DM Mono',monospace", fontSize:10, letterSpacing:2, textTransform:"uppercase", color:"#9aa0bc", marginBottom:10 }}>Pro Chart</div>
              <div style={{ fontFamily:"Georgia,serif", fontSize:26, fontWeight:700, color:"#1a1e2e", marginBottom:10 }}>{title}</div>
              <div style={{ fontSize:12, color:"#5a6282", lineHeight:1.8, marginBottom:14 }}>
                {chartStatus === "loading" && "Lade echte Binance-Candles, EMAs und Analyse-Level."}
                {chartStatus === "data_error" && "Die Marktdaten konnten nicht geladen werden. Ohne Feed wird kein Fake-Chart angezeigt."}
                {chartStatus === "library_error" && "Die Chart-Library oder Initialisierung ist fehlgeschlagen. Bitte Seite hart neu laden."}
              </div>
            </div>
          </div>
        )}
      </div>
      <div style={{ marginTop:8, fontSize:10, color:"#9aa0bc", lineHeight:1.6 }}>
        Professioneller Candlestick-Chart via Lightweight Charts mit Binance-OHLC, EMA20/50/200 sowie Stop-, Support-, Resistance- und TP-Linien. Quelle: {coin.symbol.replace("BINANCE:","")} auf Binance.
      </div>
      <div style={{ marginTop:10, display:"flex", gap:8, flexWrap:"wrap" }}>
        <div style={{ padding:"6px 10px", borderRadius:999, background:"#eef4ff", border:"1px solid #c9dafc", fontSize:10, fontWeight:700, color:"#0b57d0" }}>Blaue Linie = obere Formationskante</div>
        <div style={{ padding:"6px 10px", borderRadius:999, background:"#e9f7f1", border:"1px solid #bde4d3", fontSize:10, fontWeight:700, color:"#0b8f5a" }}>Gruene Linie = bullische Unterkante</div>
        <div style={{ padding:"6px 10px", borderRadius:999, background:"#fff1f2", border:"1px solid #f0c7cd", fontSize:10, fontWeight:700, color:"#b01222" }}>Rote Linie = bearische Formationskante</div>
      </div>
    </div>
  );
}

function mapChartIntervalToKlineInterval(interval) {
  const map = { "60":"1h", "240":"4h", "1D":"1d" };
  return map[interval] || "4h";
}

function calculateEMA(values, period) {
  if (!values.length) return null;
  const multiplier = 2 / (period + 1);
  let ema = values[0];
  for (let i = 1; i < values.length; i += 1) {
    ema = ((values[i] - ema) * multiplier) + ema;
  }
  return ema;
}

function getChartPrecision(coin) {
  if (coin.ticker === "IOTA") return 4;
  if (coin.overlay?.current < 1) return 4;
  if (coin.overlay?.current < 10) return 3;
  return 2;
}

function formatChartNumber(value, coin) {
  const precision = getChartPrecision(coin);
  return Number(value).toFixed(precision);
}

function formatChartLevel(value, coin) {
  if (value === null || value === undefined) return "";
  const parsed = typeof value === "string" ? Number(value.replace(",", ".")) : Number(value);
  if (!Number.isFinite(parsed)) return String(value);
  return formatChartNumber(parsed, coin);
}

function formatChartRange(values, coin) {
  if (!Array.isArray(values) || values.length < 2) return "";
  return `${formatChartLevel(values[0], coin)} - ${formatChartLevel(values[1], coin)}`;
}

function AnalysisOverlayChart({ coin, interval }) {
  const overlay = coin.overlay;
  if (!overlay) return null;
  const mono = { fontFamily:"'DM Mono',monospace" };
  const [marketCandles, setMarketCandles] = useState([]);
  const [candleStatus, setCandleStatus] = useState("loading");

  const chartHeight = 330;
  const chartWidth = 760;
  const padLeft = 78;
  const padRight = 26;
  const padTop = 24;
  const padBottom = 34;
  const innerWidth = chartWidth - padLeft - padRight;
  const innerHeight = chartHeight - padTop - padBottom;

  useEffect(() => {
    const symbol = coin.symbol.replace("BINANCE:", "");
    const klineInterval = mapChartIntervalToKlineInterval(interval);
    let active = true;

    setCandleStatus("loading");

    fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${klineInterval}&limit=220`)
      .then((response) => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
      })
      .then((rows) => {
        if (!active) return;
        const parsed = rows.map((row) => ({
          openTime: row[0],
          open: Number(row[1]),
          high: Number(row[2]),
          low: Number(row[3]),
          close: Number(row[4]),
        })).filter((row) => [row.open, row.high, row.low, row.close].every(Number.isFinite));

        if (!parsed.length) throw new Error("No candle data");
        setMarketCandles(parsed);
        setCandleStatus("ready");
      })
      .catch(() => {
        if (!active) return;
        setMarketCandles([]);
        setCandleStatus("error");
      });

    return () => {
      active = false;
    };
  }, [coin.symbol, interval]);

  const closeSeries = marketCandles.map((candle) => candle.close);
  const visibleCandles = marketCandles.slice(-28);
  const ema20Value = calculateEMA(closeSeries.slice(-60), 20) ?? overlay.ema20;
  const ema50Value = calculateEMA(closeSeries.slice(-120), 50) ?? overlay.ema50;
  const ema200Value = calculateEMA(closeSeries, 200) ?? overlay.ema200;
  const seriesHigh = visibleCandles.length ? Math.max(...visibleCandles.map((candle) => candle.high), ...overlay.targets, ...overlay.resistance) : overlay.max;
  const seriesLow = visibleCandles.length ? Math.min(...visibleCandles.map((candle) => candle.low), ...overlay.support, overlay.stop) : overlay.min;
  const displayMax = seriesHigh;
  const displayMin = seriesLow;

  const toY = (value) => {
    const range = displayMax - displayMin || 1;
    const ratio = (value - displayMin) / range;
    return padTop + (innerHeight - (ratio * innerHeight));
  };

  const supportYs = overlay.support.map(toY);
  const resistanceYs = overlay.resistance.map(toY);
  const buyTopY = toY(overlay.buyZone[1]);
  const buyBottomY = toY(overlay.buyZone[0]);
  const stopY = toY(overlay.stop);
  const lastClose = visibleCandles.length ? visibleCandles[visibleCandles.length - 1].close : overlay.current;
  const currentY = toY(lastClose);
  const ema20Y = toY(ema20Value);
  const ema50Y = toY(ema50Value);
  const ema200Y = toY(ema200Value);
  const candleGap = visibleCandles.length ? innerWidth / visibleCandles.length : innerWidth / 28;
  const candleWidth = Math.max(4, Math.min(12, candleGap * 0.62));
  const candleSeries = visibleCandles.map((candle, index) => ({
    ...candle,
    x: padLeft + (candleGap * index) + candleGap / 2,
  }));

  const trendLine = `M ${padLeft + innerWidth * 0.05} ${toY(displayMin + (displayMax - displayMin) * 0.18)}
    L ${padLeft + innerWidth * 0.95} ${toY(displayMin + (displayMax - displayMin) * 0.48)}`;

  const channelLine = `M ${padLeft + innerWidth * 0.08} ${toY(displayMin + (displayMax - displayMin) * 0.38)}
    L ${padLeft + innerWidth * 0.98} ${toY(displayMin + (displayMax - displayMin) * 0.68)}`;

  const formatValue = (value) => formatChartNumber(value, coin);

  return (
    <div className="frost-card soft-hover" style={{ marginTop:16, borderRadius:20, padding:"18px 18px 16px", background:"rgba(255,255,255,.86)", border:"1.5px solid rgba(210,217,232,.92)", boxShadow:"0 18px 40px rgba(33,44,82,.08)" }}>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", gap:12, marginBottom:12, flexWrap:"wrap" }}>
        <div>
          <div style={{ ...mono, fontSize:9, color:"#9aa0bc", letterSpacing:2, textTransform:"uppercase", marginBottom:5 }}>Custom Analysis Overlay</div>
          <div style={{ fontFamily:"Georgia,serif", fontSize:21, fontWeight:700, color:"#1a1e2e" }}>{coin.pair} Analyse-Chart</div>
        </div>
        <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
          <div style={{ padding:"5px 10px", borderRadius:999, background:"#f7f8fc", color:"#1a1e2e", fontSize:10, fontWeight:700 }}>{mapChartIntervalToKlineInterval(interval).toUpperCase()} Candles</div>
          <div style={{ padding:"5px 10px", borderRadius:999, background:"#e6f7f0", color:"#00875a", fontSize:10, fontWeight:700 }}>EMA 20</div>
          <div style={{ padding:"5px 10px", borderRadius:999, background:"#eef3ff", color:"#1756c8", fontSize:10, fontWeight:700 }}>EMA 50</div>
          <div style={{ padding:"5px 10px", borderRadius:999, background:"#f7f0ff", color:"#5b4fcf", fontSize:10, fontWeight:700 }}>EMA 200</div>
          <div style={{ padding:"5px 10px", borderRadius:999, background:"#fff8e6", color:"#b06a00", fontSize:10, fontWeight:700 }}>{overlay.formation}</div>
        </div>
      </div>

      <div style={{ background:"linear-gradient(180deg,#ffffff,#f8faff)", border:"1px solid #d8def0", borderRadius:18, padding:14 }}>
        <svg viewBox={`0 0 ${chartWidth} ${chartHeight}`} width="100%" height="330" style={{ display:"block" }}>
          <defs>
            <linearGradient id="analysisPriceStroke" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stopColor="#1756c8" stopOpacity=".55" />
              <stop offset="60%" stopColor={coin.color} stopOpacity=".95" />
              <stop offset="100%" stopColor="#5b4fcf" stopOpacity=".9" />
            </linearGradient>
          </defs>

          {[0,1,2,3,4].map((i) => {
            const y = padTop + (innerHeight / 4) * i;
            return <line key={i} x1={padLeft} y1={y} x2={chartWidth - padRight} y2={y} stroke="#ecf0f8" strokeWidth="1" />;
          })}

          {[0,1,2,3,4,5].map((i) => {
            const x = padLeft + (innerWidth / 5) * i;
            return <line key={i} x1={x} y1={padTop} x2={x} y2={chartHeight - padBottom} stroke="#f3f6fb" strokeWidth="1" />;
          })}

          <rect
            x={padLeft + innerWidth * 0.12}
            y={buyTopY}
            width={innerWidth * 0.42}
            height={Math.max(16, buyBottomY - buyTopY)}
            fill="#80d4b033"
            stroke="#80d4b0"
            strokeDasharray="6 5"
            rx="12"
          />

          <line x1={padLeft} y1={stopY} x2={chartWidth - padRight} y2={stopY} stroke="#c0182a" strokeWidth="2" strokeDasharray="8 5" />

          {supportYs.map((y, index) => (
            <line key={`support-${index}`} x1={padLeft} y1={y} x2={chartWidth - padRight} y2={y} stroke="#00875a" strokeWidth={index === 0 ? 2.4 : 1.4} strokeDasharray={index === 0 ? "0" : "5 5"} opacity={index === 0 ? 0.95 : 0.62} />
          ))}

          {resistanceYs.map((y, index) => (
            <line key={`res-${index}`} x1={padLeft} y1={y} x2={chartWidth - padRight} y2={y} stroke="#c0182a" strokeWidth={index === 0 ? 2.4 : 1.4} strokeDasharray={index === 0 ? "0" : "5 5"} opacity={index === 0 ? 0.95 : 0.62} />
          ))}

          <path d={trendLine} fill="none" stroke="#1756c8" strokeWidth="2.2" opacity="0.7" />
          <path d={channelLine} fill="none" stroke="#5b4fcf" strokeWidth="1.6" strokeDasharray="7 5" opacity="0.55" />

          {candleStatus === "loading" && (
            <text x={padLeft + 8} y={padTop + 16} fill="#9aa0bc" fontSize="11" fontFamily="'DM Mono', monospace">Lade echte Candles...</text>
          )}
          {candleStatus === "error" && (
            <text x={padLeft + 8} y={padTop + 16} fill="#c0182a" fontSize="11" fontFamily="'DM Mono', monospace">Kline-Feed nicht erreichbar</text>
          )}

          {candleSeries.map((candle, index) => {
            const bullish = candle.close >= candle.open;
            const openY = toY(candle.open);
            const closeY = toY(candle.close);
            const highY = toY(candle.high);
            const lowY = toY(candle.low);
            const bodyTop = Math.min(openY, closeY);
            const bodyHeight = Math.max(4, Math.abs(closeY - openY));
            const candleColor = bullish ? "#0d8c61" : "#c0182a";

            return (
              <g key={`candle-${index}`} opacity="0.98">
                <line x1={candle.x} y1={highY} x2={candle.x} y2={lowY} stroke={candleColor} strokeWidth="1.4" strokeLinecap="round" />
                <rect
                  x={candle.x - candleWidth / 2}
                  y={bodyTop}
                  width={candleWidth}
                  height={bodyHeight}
                  rx="2"
                  fill={bullish ? "#dff6ec" : "#ffe7eb"}
                  stroke={candleColor}
                  strokeWidth="1.2"
                />
              </g>
            );
          })}

          <path d={`M ${padLeft} ${ema20Y} L ${chartWidth - padRight} ${ema20Y - 8}`} fill="none" stroke="#00875a" strokeWidth="1.8" opacity="0.65" />
          <path d={`M ${padLeft} ${ema50Y + 4} L ${chartWidth - padRight} ${ema50Y - 4}`} fill="none" stroke="#1756c8" strokeWidth="1.8" opacity="0.6" />
          <path d={`M ${padLeft} ${ema200Y + 8} L ${chartWidth - padRight} ${ema200Y + 2}`} fill="none" stroke="#5b4fcf" strokeWidth="1.8" opacity="0.58" />
          <circle cx={chartWidth - padRight - 12} cy={currentY - 10} r="6" fill={coin.color} />

          {[
            { label:`Aktuell ${formatValue(lastClose)}`, y:currentY - 10, color:coin.color, x:chartWidth - padRight - 115 },
            { label:`Buy ${formatChartRange(overlay.buyZone, coin)}`, y:buyTopY - 8, color:"#00875a", x:padLeft + 18 },
            { label:`Stop ${formatChartLevel(overlay.stop, coin)}`, y:stopY - 8, color:"#c0182a", x:chartWidth - padRight - 88 },
            { label:`EMA20 ${formatValue(ema20Value)}`, y:ema20Y - 8, color:"#00875a", x:padLeft + 18 },
          ].map((tag) => (
            <g key={tag.label}>
              <rect x={tag.x} y={tag.y - 14} width={Math.max(82, tag.label.length * 5.4)} height="22" rx="11" fill="#ffffff" stroke={tag.color} strokeWidth="1.2" />
              <text x={tag.x + 10} y={tag.y} fill={tag.color} fontSize="11" fontWeight="700" fontFamily="'DM Mono', monospace">{tag.label}</text>
            </g>
          ))}

          {overlay.targets.map((target, index) => {
            const y = toY(target);
            return (
              <g key={`tp-${target}`}>
                <rect x={chartWidth - padRight - 92} y={y - 11} width="72" height="22" rx="11" fill="#ffffff" stroke="#1756c8" strokeWidth="1.1" />
                <text x={chartWidth - padRight - 82} y={y + 4} fill="#1756c8" fontSize="11" fontWeight="700" fontFamily="'DM Mono', monospace">{`TP${index + 1} ${formatChartLevel(target, coin)}`}</text>
              </g>
            );
          })}

          <text x={padLeft - 56} y={padTop + 8} fill="#9aa0bc" fontSize="11" fontFamily="'DM Mono', monospace">{formatValue(displayMax)}</text>
          <text x={padLeft - 56} y={chartHeight - padBottom + 4} fill="#9aa0bc" fontSize="11" fontFamily="'DM Mono', monospace">{formatValue(displayMin)}</text>
          <text x={padLeft} y={chartHeight - 10} fill="#9aa0bc" fontSize="11" fontFamily="'DM Mono', monospace">Setup-Zone</text>
          <text x={padLeft + innerWidth * 0.45} y={chartHeight - 10} fill="#9aa0bc" fontSize="11" fontFamily="'DM Mono', monospace">{overlay.formation}</text>
        </svg>
      </div>

      <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(220px,1fr))", gap:10, marginTop:12 }}>
        <div style={{ background:"#fff", border:"1px solid #e2e6f0", borderRadius:12, padding:"10px 11px" }}>
          <div style={{ ...mono, fontSize:9, color:"#9aa0bc", letterSpacing:1, marginBottom:4 }}>FORMATION</div>
          <div style={{ fontSize:12, fontWeight:700, color:"#1a1e2e" }}>{overlay.formation}</div>
        </div>
        <div style={{ background:"#fff", border:"1px solid #e2e6f0", borderRadius:12, padding:"10px 11px" }}>
          <div style={{ ...mono, fontSize:9, color:"#9aa0bc", letterSpacing:1, marginBottom:4 }}>EMA CLUSTER</div>
          <div style={{ fontSize:12, fontWeight:700, color:"#1a1e2e" }}>20 {formatValue(ema20Value)} · 50 {formatValue(ema50Value)} · 200 {formatValue(ema200Value)}</div>
        </div>
        <div style={{ background:"#fff", border:"1px solid #e2e6f0", borderRadius:12, padding:"10px 11px" }}>
          <div style={{ ...mono, fontSize:9, color:"#9aa0bc", letterSpacing:1, marginBottom:4 }}>DATENQUELLE</div>
          <div style={{ fontSize:12, fontWeight:700, color:"#1a1e2e" }}>{candleStatus === "ready" ? `Binance OHLC ${mapChartIntervalToKlineInterval(interval)}` : overlay.note}</div>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [openCoins, setOpenCoins] = useState([]);

  const mono  = { fontFamily:"'DM Mono',monospace" };
  const card  = { background:"rgba(255,255,255,.84)", border:"1.5px solid rgba(210,217,232,.92)", borderRadius:22,

  const sCol  = s => s>=70?"#00875a":s>=55?"#4a8a00":s>=40?"#b06a00":s>=25?"#c05000":"#c0182a";
  const aBg   = t => ({bullish:["#e6f7f0","#80d4b0"],bearish:["#ffeef0","#f0b0b8"],neutral:["#f7f8fc","#e2e6f0"]}[t]||["#f7f8fc","#e2e6f0"]);
  const vCol  = {AKKUMULIEREN:"#00875a","VORSICHTIG KAUFEN":"#b06a00",ABWARTEN:"#888",DEFENSIV:"#c0182a",MEIDEN:"#c0182a"};
  const vEmoji= {AKKUMULIEREN:"✅","VORSICHTIG KAUFEN":"🟡",ABWARTEN:"⏳",DEFENSIV:"⚠️",MEIDEN:"🔴"};
  const sigCol= {AKKUMULIEREN:"#00875a",KAUFEN:"#4a8a00",HALTEN:"#b06a00",BEOBACHTEN:"#888"};
  const sigBg = {AKKUMULIEREN:"#e6f7f0",KAUFEN:"#f0f7e6",HALTEN:"#fff8e6",BEOBACHTEN:"#f7f8fc"};

  const col = vCol[MARKET_VERDICT] || "#888";
  const selectedChartCoin = CHART_ANALYSES[chartCoinIndex] || CHART_ANALYSES[0];
  const selectedTradingSignalStyle = getTradingSignalStyle(selectedChartCoin?.signal || "BEOBACHTEN");
  const topChartSetups = [...CHART_ANALYSES].sort((a,b) => b.score - a.score).slice(0, 5);
  const setupMetrics = getSetupMetrics(selectedChartCoin);
  const chartScenario = buildChartScenario(selectedChartCoin);
  const formatSelectedChartValue = (value) => formatChartLevel(value, selectedChartCoin);
  const formattedBuyZone = formatChartRange(selectedChartCoin.overlay?.buyZone || [], selectedChartCoin) || selectedChartCoin.setup.buyZone;
  const formattedTakeProfit = (selectedChartCoin.setup.takeProfit || []).map((target) => formatSelectedChartValue(target));
  const formattedSupportLevels = (selectedChartCoin.levels.support || []).map((level) => formatSelectedChartValue(level));
  const formattedResistanceLevels = (selectedChartCoin.levels.resistance || []).map((level) => formatSelectedChartValue(level));
  const formattedChartHeaderPrice = Number.isFinite(parseLevelValue(selectedChartCoin.overlay?.current))
    ? `$${formatSelectedChartValue(selectedChartCoin.overlay.current)}`
    : selectedChartCoin.price;
  const formattedStop = formatSelectedChartValue(selectedChartCoin.setup.stop);
  const chartQuickFacts = [
    { label:"Trend", value:selectedChartCoin.trend, tone:selectedTradingSignalStyle.color },
    { label:"Phase", value:selectedChartCoin.phase, tone:"#1a1e2e" },
    { label:"Risiko", value:selectedChartCoin.risk, tone:"#b06a00" },
    { label:"Signal", value:selectedChartCoin.signal, tone:selectedTradingSignalStyle.color },
  ];
  const chartMetaStats = [
    { label:"Entry", value:Number.isFinite(setupMetrics.entry) ? formatSelectedChartValue(setupMetrics.entry) : formattedBuyZone },
    { label:"Stop", value:formattedStop },
    { label:"TP1", value:formattedTakeProfit[0] || "-" },
    { label:"CRV", value:selectedChartCoin.setup.crv },
  ];
  const chartChecklist = [
    `Buy-Zone ${formattedBuyZone} bleibt der bevorzugte Reaktionsbereich.`,
    `Trigger-Entry erst bei Break ueber ${selectedChartCoin.setup.altEntry.replace("Breakout ueber ","")}.`,
    `Unter ${formattedStop} ist das aktuelle Setup technisch invalidiert.`,
    `Hoeheres Zielband bleibt ${formattedTakeProfit.join(" / ")} bei stabiler Struktur.`,
  ];
  
  useEffect(() => {
    const updateCoinGridColumns = () => {
      if (!coinGridRef.current) return;
      const minCardWidth = 320;
      const gridGap = 14;
      const gridWidth = coinGridRef.current.offsetWidth;
      const columns = Math.max(1, Math.floor((gridWidth + gridGap) / (minCardWidth + gridGap)));
      setCoinGridColumns(columns);
    };

    updateCoinGridColumns();
    window.addEventListener("resize", updateCoinGridColumns);

    return () => window.removeEventListener("resize", updateCoinGridColumns);
  }, []);

  const toggleCoinRow = (index) => {
    const rowStart = Math.floor(index / coinGridColumns) * coinGridColumns;
    const rowIndices = COINS
      .slice(rowStart, rowStart + coinGridColumns)
      .map((_, offset) => rowStart + offset);

    setOpenCoins(prev => {
      const allRowOpen = rowIndices.every(rowIndex => prev.includes(rowIndex));
      if (allRowOpen) {
        return prev.filter(openIndex => !rowIndices.includes(openIndex));
      }
      return Array.from(new Set([...prev, ...rowIndices])).sort((a,b) => a - b);
    });
  };

  const toggleCoinSubScore = (coinIndex, subScoreIndex) => {
    const key = `${coinIndex}-${subScoreIndex}`;
    setOpenCoinSubScores(prev => ({ ...prev, [key]: !prev[key] }));
  };

  return (
    <div className="page-shell" style={{ minHeight:"100vh", padding:"24px 16px 72px", fontFamily:"Outfit,sans-serif" }}>

              <div style={{ display:"inline-flex", alignItems:"center", gap:8, padding:"7px 12px", borderRadius:999, background:"rgba(23,86,200,.08)", color:"#1756c8", fontSize:10, letterSpacing:1.8, textTransform:"uppercase", ...mono, marginBottom:14 }}>
                Live Dashboard Â· Senior Chart Analyst
              </div>
              <div style={{ fontFamily:"Georgia,serif", fontSize:36, fontWeight:900, lineHeight:1.02, letterSpacing:"-.03em", marginBottom:10 }}>
                Crypto <span style={{ color:"#1756c8" }}>Signal</span> System
              </div>
              <div style={{ fontSize:14, color:"#5a6282", lineHeight:1.75, maxWidth:620 }}>
                Marktstruktur, Coin-Bewertung und Quellen-Transparenz in einem kompakten Analyse-Board. Die Farbwelt bleibt bewusst vertraut, die Oberfläche ist klarer, ruhiger und moderner aufgebaut.
              </div>
            </div>
            <div style={{ display:"grid", gap:10 }}>
              <div className="frost-card soft-hover" style={{ borderRadius:20, padding:"16px 18px", background:"linear-gradient(135deg, rgba(23,86,200,.10), rgba(91,79,207,.10))" }}>
                <div style={{ ...mono, fontSize:9, color:"#5b4fcf", letterSpacing:2, textTransform:"uppercase", marginBottom:8 }}>Stand</div>
                <div style={{ fontSize:14, fontWeight:700, color:"#1a1e2e", marginBottom:3 }}>{META.date}</div>
                <div style={{ fontSize:11, color:"#5a6282", lineHeight:1.6 }}>{vEmoji[MARKET_VERDICT]} Gesamturteil {MARKET_VERDICT} bei Markt-Score {MARKET_TOTAL_SCORE}/100.</div>
              </div>
              <div style={{ display:"flex", gap:10, flexWrap:"wrap" }}>
                <div
                  className="frost-card soft-hover"
                  onClick={() => setOpenChanceRiskDetails(prev => !prev)}
                  style={{ flex:"1 1 150px", borderRadius:18, padding:"14px 16px", cursor:"pointer" }}
                >
                  <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", gap:8, marginBottom:6 }}>
                    <div style={{ ...mono, fontSize:9, color:"#9aa0bc", letterSpacing:2, textTransform:"uppercase" }}>Chance / Risiko</div>
                    <div style={{ fontSize:11, fontWeight:700, color:"#1756c8", lineHeight:1 }}>{openChanceRiskDetails ? "▲" : "▼"}</div>
                  </div>
                  <div style={{ display:"flex", alignItems:"baseline", gap:8, marginBottom:3 }}>
                    <div style={{ fontFamily:"Georgia,serif", fontSize:24, fontWeight:900, color:"#00875a", lineHeight:1 }}>{CHANCE_RISK_PROFILE.upside.toFixed(1)}x</div>
                    <div style={{ fontFamily:"Georgia,serif", fontSize:14, fontWeight:700, color:"#9aa0bc", lineHeight:1 }}>/</div>
                    <div style={{ fontFamily:"Georgia,serif", fontSize:24, fontWeight:900, color:"#c0182a", lineHeight:1 }}>{CHANCE_RISK_PROFILE.risk.toFixed(1)}x</div>
                  </div>
                  <div style={{ fontSize:10, color:"#5a6282", lineHeight:1.6 }}>{CHANCE_RISK_PROFILE.ratio.toFixed(2)}:1 Chance zu Risiko.</div>
                  {openChanceRiskDetails && (
                    <div style={{ marginTop:10, paddingTop:10, borderTop:"1px solid #d8def0" }}>
                      <div style={{ ...mono, fontSize:9, color:"#1756c8", letterSpacing:1, marginBottom:6 }}>HERLEITUNG DER KENNZAHLEN</div>
                      {CHANCE_RISK_DERIVATION.map((item, index) => (
                        <div key={index} style={{ fontSize:11, color:"#1a1e2e", lineHeight:1.6, marginBottom:index === CHANCE_RISK_DERIVATION.length - 1 ? 0 : 6 }}>
                          {item}

                      ))}
                    </div>

                <div className="frost-card soft-hover" style={{ flex:"1 1 150px", borderRadius:18, padding:"14px 16px" }}>
                  <div style={{ ...mono, fontSize:9, color:"#9aa0bc", letterSpacing:2, textTransform:"uppercase", marginBottom:6 }}>Recherche</div>
                  <div style={{ fontSize:13, fontWeight:700, color:"#1a1e2e", marginBottom:3 }}>Claude AI</div>
                  <div style={{ fontSize:10, color:"#5a6282", lineHeight:1.6 }}>Datenquellen, Marktfilter, Coin-Modell und Methodik verbunden.</div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div style={{ display:"none", justifyContent:"space-between", alignItems:"flex-start", marginBottom:16, flexWrap:"wrap", gap:10 }}>
          <div>
            <div style={{ fontFamily:"Georgia,serif", fontSize:26, fontWeight:900, lineHeight:1.1 }}>
              Crypto <span style={{ color:"#1756c8" }}>Signal</span> System
            </div>
            <div style={{ ...mono, fontSize:10, color:"#9aa0bc", letterSpacing:2, textTransform:"uppercase", marginTop:5 }}>

          </div>
          <div style={{ background:"linear-gradient(135deg,#1756c8,#5b4fcf)", color:"#fff", padding:"5px 14px", borderRadius:20, fontSize:11, ...mono, letterSpacing:1, alignSelf:"center" }}>
            📡 Recherche Claude AI
          </div>
        </div>

        {/* TAB NAV */}
        <div className="fade-up" style={{ display:"flex", gap:10, marginBottom:18, animationDelay:".08s" }}>
          {[["market","📊 Markt Signal"],["coins","🏆 Coin Analyse"],["chart","📈 Chart Analyse"]].map(([key,label])=>(
            <button key={key} className="tab-chip" onClick={()=>setTab(key)} style={{
              padding:"11px 22px", borderRadius:999, border:"1.5px solid",
              borderColor: tab===key?"#1756c8":"#e2e6f0",
              background: tab===key?"linear-gradient(135deg,#1756c8,#5b4fcf)":"rgba(255,255,255,.76)",
              color: tab===key?"#fff":"#5a6282",

                    animationDelay:`${0.12 + (i * 0.05)}s`

                      <MiniGauge score={c.score} color={sc}/>

                            display:"flex", alignItems:"center", justifyContent:"center",
                            ...mono, fontSize:9, fontWeight:700, flexShrink:0 }}>
